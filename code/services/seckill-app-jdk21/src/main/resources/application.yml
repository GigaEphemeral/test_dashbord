spring:
  application:
    name: seckill-app
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    # Redis is the product cache L2. Connections are lazy, so a Redis outage
    # degrades reads to the database instead of preventing startup.
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Explicit write/read datasource pair (Task 15). In dev both URLs point at the
# same MySQL; DB_WRITE_URL/DB_READ_URL are the M3 hooks for MySQL Router
# 6446 (read-write) and 6447 (read-only). The primary DataSource is a lazy
# proxy over the routing datasource, so JPA, Flyway and health checks all use
# the write pool unless a read-only transaction is active.
app:
  datasource:
    write:
      jdbc-url: ${DB_WRITE_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: write-pool
    read:
      jdbc-url: ${DB_READ_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: read-pool

server:
  port: 8080
  # Boot 3 disables the Tomcat MBean registry by default; D2 reads
  # tomcat_threads_busy_threads, so the lab app opts back in.
  tomcat:
    mbeanregistry:
      enabled: true

observability:
  env: dev
  instance: ${INSTANCE_ID:app-local}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Container health gate (compose healthcheck hits /actuator/health/app).
        # Empty include + exclude=redis means "every contributor except Redis"
        # (Spring Boot IncludeExcludeGroupMemberPredicate). Redis is the
        # best-effort product cache L2: during a Redis outage reads degrade to
        # MySQL and the instance must stay healthy for Docker and for the
        # design §8.2 / §15 scenario 8 failover demos. The root
        # /actuator/health still reports Redis honestly (DOWN -> 503), so this
        # does not hide the failure, it only scopes the container gate.
        app:
          exclude:
            - redis
