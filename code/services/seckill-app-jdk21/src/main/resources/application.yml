spring:
  application:
    name: seckill-app
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    # Redis is the product cache L2. Connections are lazy, so a Redis outage
    # degrades reads to the database instead of preventing startup.
    # Task M3-1b: app.redis.mode (env REDIS_MODE) selects the client style for
    # BOTH stacks (Lettuce here, Redisson below). standalone uses host/port;
    # sentinel discovers the master BY NAME through spring.data.redis.sentinel.*
    # and never consults host/port — nothing is hardcoded in either mode.
    #
    # Why the sentinel.* subtree is NOT declared here with empty defaults:
    # Boot's RedisConnectionConfiguration constructor calls determineMode() as
    # soon as ANY spring.data.redis.sentinel key exists, and building a
    # RedisSentinelConfiguration from an empty master name aborts EVERY startup
    # with "Sentinel Master Id must not be null or empty" — the dev stack and
    # every @SpringBootTest included (measured in M3-1b). So the keys arrive only
    # when the topology exists: compose.ha.yml maps the lab-friendly
    # REDIS_HA_MASTER_NAME / REDIS_SENTINEL_NODES / REDIS_HA_SENTINEL_PASSWORD
    # onto the standard SPRING_DATA_REDIS_SENTINEL_MASTER / _NODES / _PASSWORD
    # properties. Running the jar outside compose: set REDIS_MODE=sentinel plus
    # those three properties (System env, -D args or application-<profile>.yml).
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

  # Async seckill order queue (Task 16). The listener starts with the context,
  # so every full-context test needs a broker
  # (see MySqlRabbitIntegrationTestSupport).
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_DEFAULT_USER:lab}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:lab}}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:4}
        prefetch: ${RABBITMQ_CONSUMER_PREFETCH:20}
        # A failed seckill message is compensated and marked FAILED; never
        # requeue it in an infinite loop.
        default-requeue-rejected: false

# Explicit write/read datasource pair (Task 15). In dev both URLs point at the
# same MySQL; DB_WRITE_URL/DB_READ_URL are the M3 hooks for MySQL Router
# 6446 (read-write) and 6447 (read-only). The primary DataSource is a lazy
# proxy over the routing datasource, so JPA, Flyway and health checks all use
# the write pool unless a read-only transaction is active.
app:
  # Redis client mode switch (Task M3-1b, design §3.3): standalone = dev
  # single-node jl-redis, sentinel = the ha-profile Sentinel group. ONE env var
  # moves both the Lettuce (cache L2) and the Redisson (lock/idempotency/Lua/
  # bloom) stack; any other value fails startup. The sentinel.* keys here only
  # size the best-effort discovery log — endpoints live in spring.data.redis.*.
  redis:
    mode: ${REDIS_MODE:standalone}
    sentinel:
      # Startup discovery window: this many SENTINEL masters probes, answered by
      # the monitored master NAME, each logged whenever the reported address
      # changes (daemon thread: the app boots and degrades even when the
      # Sentinels are unreachable). Raise both knobs to widen the observation
      # window for a failover drill without a code change.
      discovery-report-attempts: ${REDIS_DISCOVERY_REPORT_ATTEMPTS:12}
      discovery-report-interval-ms: ${REDIS_DISCOVERY_REPORT_INTERVAL_MS:5000}

  datasource:
    write:
      jdbc-url: ${DB_WRITE_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: write-pool
    read:
      jdbc-url: ${DB_READ_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: read-pool

  # Mock login (Task 17): the k6/demo token store. No user table and no auth
  # enforcement yet; the Redis value is the future principal lookup key.
  login:
    token-key-prefix: ${LOGIN_TOKEN_KEY_PREFIX:login:token:}
    token-ttl-seconds: ${LOGIN_TOKEN_TTL_SECONDS:1800}

  # Internal runtime lab API (Task 17). Nginx does not proxy /lab/**; the app
  # instances have no host port, so only in-network callers (docker exec, the
  # chaos-controller later) can reach it. The token is never logged.
  lab:
    token: ${LAB_TOKEN:lab-token}

    # Cache experiment (Task 25 / design 8.4). /lab/cache/seed generates the
    # dataset in a RESERVED id range above protected-max-id, so the Flyway demo
    # products (1 and 20, stock 100, zero orders) that verify.sh / smoke.sh /
    # reset-lab.sh assert on are never written. Counts, id range, TTLs, jitter,
    # batch size, SCAN hint and the bloom geometry are all here; nothing is
    # hardcoded in Java.
    cache:
      seed:
        # 1000 experiment products, ids 90000..90999 by default.
        product-count: ${LAB_CACHE_SEED_PRODUCT_COUNT:1000}
        start-id: ${LAB_CACHE_SEED_START_ID:90000}
        # Highest id that belongs to the demo baseline; seeding must start above it.
        protected-max-id: ${LAB_CACHE_SEED_PROTECTED_MAX_ID:1000}
        # M4-2/M4-3 avalanche set: this many keys are warmed with ONE identical
        # TTL so they expire in the same second.
        avalanche-key-count: ${LAB_CACHE_SEED_AVALANCHE_KEY_COUNT:200}
        avalanche-ttl-seconds: ${LAB_CACHE_SEED_AVALANCHE_TTL_SECONDS:60}
        # One designated hot key, addressed as an offset inside the range. It must
        # sit at or after avalanche-key-count: it is warmed with its own TTL, so an
        # offset inside the avalanche range would overwrite an identically-expiring
        # key (rejected by startup validation).
        hot-key-index: ${LAB_CACHE_SEED_HOT_KEY_INDEX:999}
        hot-key-ttl-seconds: ${LAB_CACHE_SEED_HOT_KEY_TTL_SECONDS:300}
        write-batch-size: ${LAB_CACHE_SEED_WRITE_BATCH_SIZE:200}
        name-prefix: ${LAB_CACHE_SEED_NAME_PREFIX:实验商品}
        status: ${LAB_CACHE_SEED_STATUS:ON_SALE}
        price: ${LAB_CACHE_SEED_PRICE:99.00}
      state:
        # Redis SCAN COUNT hint used by GET /lab/cache/state to count live keys.
        scan-count: ${LAB_CACHE_STATE_SCAN_COUNT:500}
      penetration:
        # Startup seed of the runtime mode; POST /lab/cache/mode switches it
        # without a restart. off is the unprotected symptom state the lab starts in.
        mode: ${LAB_CACHE_DEFENSE_MODE:off}
        null-cache:
          key-prefix: ${LAB_CACHE_NULL_KEY_PREFIX:null:product:}
          # Short TTL because a marker only promises "absent so far"; the jitter
          # keeps a miss burst from expiring in lockstep with the avalanche keys.
          ttl-seconds: ${LAB_CACHE_NULL_TTL_SECONDS:10}
          jitter-seconds: ${LAB_CACHE_NULL_JITTER_SECONDS:5}
        bloom:
          key: ${LAB_CACHE_BLOOM_KEY:bloom:product-ids}
          # Capacity covers the demo products plus the experiment range with room
          # for growth; re-seeding rebuilds the filter from the real id set.
          expected-insertions: ${LAB_CACHE_BLOOM_EXPECTED_INSERTIONS:10000}
          false-probability: ${LAB_CACHE_BLOOM_FALSE_PROBABILITY:0.01}

  # Runtime experiment toggles (Task 17). Per-instance, in-memory and mutable
  # through POST /lab/toggles; the chaos-controller will broadcast later.
  # mq is seeded by the Task 16 startup switch so the old env var still works
  # when LAB_TOGGLE_MQ is not set.
  toggles:
    lock: ${LAB_TOGGLE_LOCK:true}
    idempotency: ${LAB_TOGGLE_IDEMPOTENCY:true}
    mq: ${LAB_TOGGLE_MQ:${SECKILL_ASYNC_ENABLED:true}}
    ratelimit: ${LAB_TOGGLE_RATELIMIT:true}
    circuitbreaker: ${LAB_TOGGLE_CIRCUITBREAKER:true}
    cache: ${LAB_TOGGLE_CACHE:true}

  # Async seckill admission (Task 16). Every path, timeout, TTL, key prefix,
  # queue/exchange name, pacing delay and pool size is externalized here and
  # overridable through the environment; no runtime value is hardcoded in Java.
  seckill:
    async-enabled: ${SECKILL_ASYNC_ENABLED:true}
    lock:
      key-prefix: ${SECKILL_LOCK_KEY_PREFIX:lock:seckill:}
      wait-ms: ${SECKILL_LOCK_WAIT_MS:500}
      lease-ms: ${SECKILL_LOCK_LEASE_MS:3000}
    stock:
      key-prefix: ${SECKILL_STOCK_KEY_PREFIX:seckill:stock:}
      seed-on-startup: ${SECKILL_STOCK_SEED_ON_STARTUP:true}
      lua-path: ${SECKILL_STOCK_LUA_PATH:lua/seckill_stock.lua}
    request:
      key-prefix: ${SECKILL_REQUEST_KEY_PREFIX:seckill:request:}
      ttl-seconds: ${SECKILL_REQUEST_TTL_SECONDS:1800}
    idempotency:
      key-prefix: ${SECKILL_IDEMPOTENCY_KEY_PREFIX:seckill:idem:}
      ttl-seconds: ${SECKILL_IDEMPOTENCY_TTL_SECONDS:1800}
    mq:
      exchange: ${SECKILL_MQ_EXCHANGE:seckill.order.exchange}
      queue: ${SECKILL_MQ_QUEUE:seckill.order.queue}
      routing-key: ${SECKILL_MQ_ROUTING_KEY:seckill.order.requested}
    consumer:
      delay-ms: ${SECKILL_CONSUMER_DELAY_MS:20}
    redisson:
      connect-timeout-ms: ${SECKILL_REDISSON_CONNECT_TIMEOUT_MS:3000}
      timeout-ms: ${SECKILL_REDISSON_TIMEOUT_MS:3000}
      retry-attempts: ${SECKILL_REDISSON_RETRY_ATTEMPTS:3}
      retry-interval-ms: ${SECKILL_REDISSON_RETRY_INTERVAL_MS:1000}
      connection-minimum-idle-size: ${SECKILL_REDISSON_MIN_IDLE:2}
      connection-pool-size: ${SECKILL_REDISSON_POOL_SIZE:8}
      # No Redis connection at startup: a Redis outage must not block boot
      # (Task 14 health/degradation contract) and RedisOutageCacheIT proves it.
      lazy-initialization: ${SECKILL_REDISSON_LAZY_INIT:true}
      # --- Sentinel-mode knobs (Task M3-1b). Defaults fall back to the generic
      # keys above, so standalone behaviour and the existing env overrides are
      # unchanged; set the dedicated SECKILL_REDISSON_MASTER_*/SLAVE_* vars only
      # to size the ha demo pools differently. ---
      idle-connection-timeout-ms: ${SECKILL_REDISSON_IDLE_CONNECTION_TIMEOUT_MS:10000}
      scan-interval-ms: ${SECKILL_REDISSON_SCAN_INTERVAL_MS:1000}
      # MASTER = reads/ writes all go to the discovered master (strongly
      # consistent demo semantics); switch to MASTER_SLAVE/SLAVE for the
      # read-scaling variant without a code change.
      read-mode: ${SECKILL_REDISSON_READ_MODE:MASTER}
      master-connection-minimum-idle-size: ${SECKILL_REDISSON_MASTER_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      master-connection-pool-size: ${SECKILL_REDISSON_MASTER_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      slave-connection-minimum-idle-size: ${SECKILL_REDISSON_SLAVE_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      slave-connection-pool-size: ${SECKILL_REDISSON_SLAVE_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      subscription-connection-pool-size: ${SECKILL_REDISSON_SUBSCRIPTION_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}

# Resilience4j (Task 17). The Boot 3 starter binds these instances into the
# registries; the admission service resolves them and executes them manually so
# the runtime toggles can skip protection. Only BusinessException (sold out,
# lock timeout) is ignored: the plain BizException 50301 that Task 16 uses to
# wrap Redis/MQ/stock/publish faults IS counted, so a real infrastructure
# outage accumulates the failure rate and opens the circuit (SeckillResilience-
# ConfigIT proves this with the production config). The ignore check is
# configuredClass.isAssignableFrom(thrownClass), so ignoring the subclass
# BusinessException does not swallow its parent BizException.
resilience4j:
  ratelimiter:
    instances:
      seckill:
        limit-for-period: ${SECKILL_RATE_LIMIT_PER_PERIOD:50}
        limit-refresh-period: ${SECKILL_RATE_LIMIT_REFRESH:1s}
        timeout-duration: ${SECKILL_RATE_LIMIT_TIMEOUT:0}
  circuitbreaker:
    instances:
      seckillBackend:
        sliding-window-size: ${SECKILL_CB_WINDOW:10}
        failure-rate-threshold: ${SECKILL_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${SECKILL_CB_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${SECKILL_CB_HALF_OPEN:3}
        # Resilience4j's default (100) can never be reached inside a 10-call
        # window, so the circuit would never open. Five calls are enough to
        # calculate an honest rate and keep the demo observable.
        minimum-number-of-calls: ${SECKILL_CB_MIN_CALLS:5}
        ignore-exceptions:
          - com.javalearn.lab.common.BusinessException

server:
  port: 8080
  # Boot 3 disables the Tomcat MBean registry by default; D2 reads
  # tomcat_threads_busy_threads, so the lab app opts back in.
  tomcat:
    mbeanregistry:
      enabled: true

observability:
  env: dev
  instance: ${INSTANCE_ID:app-local}

management:
  metrics:
    distribution:
      # D4 order-accept SLO (Task 18). The seckill admission timer is already
      # named order_accept_seconds; enabling the percentile histogram exports
      # order_accept_seconds_bucket for histogram_quantile P95/P99 and the SLO
      # buckets (50ms..2s) without changing timer code. Both values are
      # externalized; ORDER_ACCEPT_SLO is a comma-separated bucket list.
      percentiles-histogram:
        order_accept_seconds: true
      slo:
        order_accept_seconds: ${ORDER_ACCEPT_SLO:50ms,100ms,300ms,500ms,1s,2s}
  health:
    # An OPEN circuit or an empty rate-limiter budget is a lab result, not an
    # application failure: keep it out of /actuator/health (and the container
    # gate), otherwise Docker would mark a deliberately degraded instance
    # unhealthy and Nginx would drop it mid-experiment.
    circuitbreakers:
      enabled: false
    ratelimiters:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Container health gate (compose healthcheck hits /actuator/health/app).
        # Empty include + exclude=redis means "every contributor except Redis"
        # (Spring Boot IncludeExcludeGroupMemberPredicate). Redis is the
        # best-effort product cache L2: during a Redis outage reads degrade to
        # MySQL and the instance must stay healthy for Docker and for the
        # design §8.2 / §15 scenario 8 failover demos. The root
        # /actuator/health still reports Redis honestly (DOWN -> 503), so this
        # does not hide the failure, it only scopes the container gate.
        app:
          exclude:
            - redis
