spring:
  application:
    name: seckill-app
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    # Redis is the product cache L2. Connections are lazy, so a Redis outage
    # degrades reads to the database instead of preventing startup.
    # Task M3-1b: app.redis.mode (env REDIS_MODE) selects the client style for
    # BOTH stacks (Lettuce here, Redisson below). standalone uses host/port;
    # sentinel discovers the master BY NAME through spring.data.redis.sentinel.*
    # and never consults host/port — nothing is hardcoded in either mode.
    #
    # Why the sentinel.* subtree is NOT declared here with empty defaults:
    # Boot's RedisConnectionConfiguration constructor calls determineMode() as
    # soon as ANY spring.data.redis.sentinel key exists, and building a
    # RedisSentinelConfiguration from an empty master name aborts EVERY startup
    # with "Sentinel Master Id must not be null or empty" — the dev stack and
    # every @SpringBootTest included (measured in M3-1b). So the keys arrive only
    # when the topology exists: compose.ha.yml maps the lab-friendly
    # REDIS_HA_MASTER_NAME / REDIS_SENTINEL_NODES / REDIS_HA_SENTINEL_PASSWORD
    # onto the standard SPRING_DATA_REDIS_SENTINEL_MASTER / _NODES / _PASSWORD
    # properties. Running the jar outside compose: set REDIS_MODE=sentinel plus
    # those three properties (System env, -D args or application-<profile>.yml).
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

  # Async seckill order queue (Task 16). The listener starts with the context,
  # so every full-context test needs a broker
  # (see MySqlRabbitIntegrationTestSupport).
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_DEFAULT_USER:lab}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:lab}}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:4}
        prefetch: ${RABBITMQ_CONSUMER_PREFETCH:20}
        # A failed seckill message is compensated and marked FAILED; never
        # requeue it in an infinite loop.
        default-requeue-rejected: false

# Explicit write/read datasource pair (Task 15). The endpoints are selected by
# ONE mode switch (app.datasource.mode, env MYSQL_MODE, design §3.3/§8.3),
# name-aligned with REDIS_MODE; the image never changes:
#   standalone (default) - both pools use the single-node dev MySQL exactly as
#                          before (the jdbc-url keys below);
#   router               - write pool -> MySQL Router 6446 (read-write, follows
#                          the current primary), read pool -> Router 6447
#                          (read-only, load-balanced over the secondaries).
# The Router URLs are separate keys and are consulted ONLY in router mode.
# Missing URLs in router mode fail startup instead of silently falling back to
# the dev MySQL (same philosophy as REDIS_MODE=sentinel), and setting DB_*_URL
# without MYSQL_MODE=router is ignored: the mode, not key presence, switches.
# The primary DataSource is a lazy proxy over the routing datasource, so JPA,
# Flyway and health checks all use the write pool unless a read-only transaction
# is active.
app:
  # Redis client mode switch (Task M3-1b, design §3.3): standalone = dev
  # single-node jl-redis, sentinel = the ha-profile Sentinel group. ONE env var
  # moves both the Lettuce (cache L2) and the Redisson (lock/idempotency/Lua/
  # bloom) stack; any other value fails startup. The sentinel.* keys here only
  # size the best-effort discovery log — endpoints live in spring.data.redis.*.
  redis:
    mode: ${REDIS_MODE:standalone}
    sentinel:
      # Startup discovery window: this many SENTINEL masters probes, answered by
      # the monitored master NAME, each logged whenever the reported address
      # changes (daemon thread: the app boots and degrades even when the
      # Sentinels are unreachable). Raise both knobs to widen the observation
      # window for a failover drill without a code change.
      discovery-report-attempts: ${REDIS_DISCOVERY_REPORT_ATTEMPTS:12}
      discovery-report-interval-ms: ${REDIS_DISCOVERY_REPORT_INTERVAL_MS:5000}

  datasource:
    # MYSQL_MODE=standalone|router (design §3.3/§8.3). Unknown values fail
    # startup with a message naming MYSQL_MODE.
    mode: ${MYSQL_MODE:standalone}
    router:
      # MySQL Router endpoints on jl-net (compose.mysql.yml). Deliberately
      # empty by default: a router-mode start without them must fail, never
      # fall back to the dev MySQL below.
      write-url: ${DB_WRITE_URL:}
      read-url: ${DB_READ_URL:}
    # Standalone (dev) endpoints: used by BOTH pools when MYSQL_MODE=standalone.
    write:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: write-pool
    read:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:seckill}
      password: ${MYSQL_PASSWORD:seckill}
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: read-pool

  # Mock login (Task 17): the k6/demo token store. No user table and no auth
  # enforcement yet; the Redis value is the future principal lookup key.
  login:
    token-key-prefix: ${LOGIN_TOKEN_KEY_PREFIX:login:token:}
    token-ttl-seconds: ${LOGIN_TOKEN_TTL_SECONDS:1800}

  # Internal runtime lab API (Task 17). Nginx does not proxy /lab/**; the app
  # instances have no host port, so only in-network callers (docker exec, the
  # chaos-controller later) can reach it. The token is never logged.
  lab:
    token: ${LAB_TOKEN:lab-token}

    # Cache experiment (Task 25 / design 8.4). /lab/cache/seed generates the
    # dataset in a RESERVED id range above protected-max-id, so the Flyway demo
    # products (1 and 20, stock 100, zero orders) that verify.sh / smoke.sh /
    # reset-lab.sh assert on are never written. Counts, id range, TTLs, jitter,
    # batch size, SCAN hint and the bloom geometry are all here; nothing is
    # hardcoded in Java.
    cache:
      seed:
        # 1000 experiment products, ids 90000..90999 by default.
        product-count: ${LAB_CACHE_SEED_PRODUCT_COUNT:1000}
        start-id: ${LAB_CACHE_SEED_START_ID:90000}
        # Highest id that belongs to the demo baseline; seeding must start above it.
        protected-max-id: ${LAB_CACHE_SEED_PROTECTED_MAX_ID:1000}
        # M4-2/M4-3 avalanche set: this many keys are warmed with ONE identical
        # TTL so they expire in the same second.
        avalanche-key-count: ${LAB_CACHE_SEED_AVALANCHE_KEY_COUNT:200}
        avalanche-ttl-seconds: ${LAB_CACHE_SEED_AVALANCHE_TTL_SECONDS:60}
        # One designated hot key, addressed as an offset inside the range. It must
        # sit at or after avalanche-key-count: it is warmed with its own TTL, so an
        # offset inside the avalanche range would overwrite an identically-expiring
        # key (rejected by startup validation).
        hot-key-index: ${LAB_CACHE_SEED_HOT_KEY_INDEX:999}
        hot-key-ttl-seconds: ${LAB_CACHE_SEED_HOT_KEY_TTL_SECONDS:300}
        write-batch-size: ${LAB_CACHE_SEED_WRITE_BATCH_SIZE:200}
        name-prefix: ${LAB_CACHE_SEED_NAME_PREFIX:实验商品}
        status: ${LAB_CACHE_SEED_STATUS:ON_SALE}
        price: ${LAB_CACHE_SEED_PRICE:99.00}
      state:
        # Redis SCAN COUNT hint used by GET /lab/cache/state to count live keys.
        scan-count: ${LAB_CACHE_STATE_SCAN_COUNT:500}
      penetration:
        # Startup seed of the runtime mode; POST /lab/cache/mode switches it
        # without a restart. off is the unprotected symptom state the lab starts in.
        # Since M4-2 this key seeds ALL defense modes: off/null-cache/bloom are
        # the penetration strategies, mutex/logical-expire the breakdown ones.
        mode: ${LAB_CACHE_DEFENSE_MODE:off}
        null-cache:
          key-prefix: ${LAB_CACHE_NULL_KEY_PREFIX:null:product:}
          # Short TTL because a marker only promises "absent so far"; the jitter
          # keeps a miss burst from expiring in lockstep with the avalanche keys.
          ttl-seconds: ${LAB_CACHE_NULL_TTL_SECONDS:10}
          jitter-seconds: ${LAB_CACHE_NULL_JITTER_SECONDS:5}
        bloom:
          key: ${LAB_CACHE_BLOOM_KEY:bloom:product-ids}
          # Capacity covers the demo products plus the experiment range with room
          # for growth; re-seeding rebuilds the filter from the real id set.
          expected-insertions: ${LAB_CACHE_BLOOM_EXPECTED_INSERTIONS:10000}
          false-probability: ${LAB_CACHE_BLOOM_FALSE_PROBABILITY:0.01}
      # 击穿 (hot-key breakdown) defense, design 8.4. Same runtime switch as the
      # penetration modes; every lock time, TTL, bound and pool number is here.
      breakdown:
        mutex:
          # Redisson lock per key (prefix + id); one holder rebuilds, waiters
          # double-check L2/stale before touching the DB. lease-ms >= wait-ms
          # is enforced at startup, or a waiter could lock after the rebuild
          # lease has already expired.
          key-prefix: ${LAB_CACHE_MUTEX_KEY_PREFIX:lock:product:}
          wait-ms: ${LAB_CACHE_MUTEX_WAIT_MS:200}
          lease-ms: ${LAB_CACHE_MUTEX_LEASE_MS:2000}
          # What a waiter whose lock wait timed out does: db = honestly query
          # the database (default), stale = serve the retained value if one
          # exists, else still db. This is the visible P99 cost knob.
          on-lock-timeout: ${LAB_CACHE_MUTEX_ON_LOCK_TIMEOUT:db}
        logical-expire:
          # Value keeps its own logical TTL; after that it is served stale for
          # up to retention-seconds (physical window, must be larger) while ONE
          # async refresh rebuilds it and publishes the fresh value back into
          # the shared cache, so the stale window is one refresh, not a TTL.
          # retention-seconds must ALSO exceed seed.hot-key-ttl-seconds (and the
          # fixed 5-minute L2 write TTL), or the stale entry is already gone when
          # the hot key expires and the demo degrades to a cold stampede; this
          # relationship is enforced at startup.
          logical-ttl-seconds: ${LAB_CACHE_LOGICAL_TTL_SECONDS:30}
          retention-seconds: ${LAB_CACHE_LOGICAL_RETENTION_SECONDS:600}
          # Per-instance bounded stale store; a key storm cannot grow it.
          max-entries: ${LAB_CACHE_LOGICAL_MAX_ENTRIES:10000}
          # Bounded refresh pool; saturation is counted as
          # cache_breakdown_refresh{result="rejected"} and stale keeps serving.
          refresh-pool-size: ${LAB_CACHE_LOGICAL_REFRESH_POOL_SIZE:2}
          refresh-queue-capacity: ${LAB_CACHE_LOGICAL_REFRESH_QUEUE_CAPACITY:100}
          keep-alive-seconds: ${LAB_CACHE_LOGICAL_REFRESH_KEEP_ALIVE_SECONDS:60}
          thread-name-prefix: ${LAB_CACHE_LOGICAL_REFRESH_THREAD_PREFIX:breakdown-refresh}

      # Caffeine 预热 (M4-3, design 8.4). The hot-key tracker is per instance and
      # capped; the Top-N is published to ONE shared Redis ZSet so every
      # instance preheats from the same list. Startup/periodic preheat warms L1
      # from L2 only — it never rewrites cache:product:<id> TTLs, otherwise the
      # M4-2 avalanche experiment's identical-TTL set would be destroyed.
      preheat:
        # Gates the automatic startup + periodic runs. Hot-key tracking and
        # publishing stay active, and POST /lab/cache/preheat stays available.
        enabled: ${LAB_CACHE_PREHEAT_ENABLED:true}
        top-n: ${LAB_CACHE_PREHEAT_TOP_N:200}
        hot-list-key: ${LAB_CACHE_PREHEAT_HOT_LIST_KEY:hot:products}
        tracker:
          # Caffeine cap on tracked product ids (design 8.4: 10 万).
          capacity: ${LAB_CACHE_PREHEAT_TRACKER_CAPACITY:100000}
          # Counters halve once per interval (design 8.4: 30s).
          decay-interval-seconds: ${LAB_CACHE_PREHEAT_TRACKER_DECAY_INTERVAL_SECONDS:30}
          # How often the local Top-N replaces the shared ZSet.
          flush-interval-seconds: ${LAB_CACHE_PREHEAT_TRACKER_FLUSH_INTERVAL_SECONDS:10}
        load:
          # Rate limit: this many L2 reads, then chunk-pause-ms of sleep.
          chunk-size: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_SIZE:50}
          chunk-pause-ms: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_PAUSE_MS:50}
          # The startup run is async after ApplicationReadyEvent, never during boot.
          startup-delay-ms: ${LAB_CACHE_PREHEAT_STARTUP_DELAY_MS:1000}
          # Incremental reheat period (design 8.4: 5 minutes).
          periodic-interval-seconds: ${LAB_CACHE_PREHEAT_PERIODIC_INTERVAL_SECONDS:300}
          scheduler-pool-size: ${LAB_CACHE_PREHEAT_SCHEDULER_POOL_SIZE:1}
          thread-name-prefix: ${LAB_CACHE_PREHEAT_THREAD_PREFIX:cache-preheat}
        # The former TwoLevelCache L1 constants, now externalized. Defaults keep
        # the previous behaviour (10k / 60s); refreshAfterWrite is the design's
        # async "refresh L1 from L2" story and must stay below the write expiry.
        l1:
          maximum-size: ${LAB_CACHE_L1_MAXIMUM_SIZE:10000}
          refresh-after-write-seconds: ${LAB_CACHE_L1_REFRESH_AFTER_WRITE_SECONDS:10}
          expire-after-write-seconds: ${LAB_CACHE_L1_EXPIRE_AFTER_WRITE_SECONDS:60}

    # Fault-thread lab (Task M5-1 / design 9.1). /lab/thread/** injects the seven
    # faulty-thread modes; every thread count, TTL, interval, chunk size, pool size
    # and the OOM throwaway gate is externalized here — nothing is hardcoded. The
    # heap-leak cap is a percentage of max heap so the shared JVM is never pushed to
    # a real OOM, and oom.throwaway-instance defaults to false so /lab/thread/fault
    # {mode:"oom"} is refused on the shared app unless a node opts in.
    thread:
      default-ttl-seconds: ${LAB_THREAD_DEFAULT_TTL_SECONDS:120}
      shutdown-join-timeout-ms: ${LAB_THREAD_SHUTDOWN_JOIN_TIMEOUT_MS:2000}
      oom:
        throwaway-instance: ${LAB_THREAD_OOM_THROWAWAY:false}
        chunk-bytes: ${LAB_THREAD_OOM_CHUNK_BYTES:8388608}
        interval-ms: ${LAB_THREAD_OOM_INTERVAL_MS:50}
      deadlock:
        thread-count: ${LAB_THREAD_DEADLOCK_THREADS:2}
        hold-ms: ${LAB_THREAD_DEADLOCK_HOLD_MS:50}
        # true = permanent two-monitor inversion: the thread dump reports
        # "Found one Java-level deadlock" (design 9.1 teaching artefact), but the
        # deadlocked threads can only be reclaimed by a JVM restart — enable on a
        # disposable instance only. Default false = drainable BLOCKED contention.
        true-deadlock: ${LAB_THREAD_DEADLOCK_TRUE:false}
      stuck:
        thread-count: ${LAB_THREAD_STUCK_THREADS:4}
        poll-ms: ${LAB_THREAD_STUCK_POLL_MS:200}
      cpu-burn:
        thread-count: ${LAB_THREAD_CPU_BURN_THREADS:2}
        yield-every-loops: ${LAB_THREAD_CPU_BURN_YIELD_EVERY_LOOPS:100000}
      heap-leak:
        chunk-bytes: ${LAB_THREAD_HEAP_LEAK_CHUNK_BYTES:1048576}
        interval-ms: ${LAB_THREAD_HEAP_LEAK_INTERVAL_MS:200}
        cap-percent: ${LAB_THREAD_HEAP_LEAK_CAP_PERCENT:80}
      thread-leak:
        max-live-threads: ${LAB_THREAD_THREAD_LEAK_MAX_LIVE:200}
        spawn-count: ${LAB_THREAD_THREAD_LEAK_SPAWN_COUNT:5}
        spawn-interval-ms: ${LAB_THREAD_THREAD_LEAK_SPAWN_INTERVAL_MS:50}
        hold-ms: ${LAB_THREAD_THREAD_LEAK_HOLD_MS:60000}
        # JDK21 contrast switch: true leaks virtual threads (heap growth) instead of
        # live platform threads; overridable per request via the console.
        virtual: ${LAB_THREAD_THREAD_LEAK_VIRTUAL:false}
      starvation:
        pool-size: ${LAB_THREAD_STARVATION_POOL_SIZE:2}
        queue-capacity: ${LAB_THREAD_STARVATION_QUEUE_CAPACITY:50}
        submit-count: ${LAB_THREAD_STARVATION_SUBMIT_COUNT:100}
        task-block-ms: ${LAB_THREAD_STARVATION_TASK_BLOCK_MS:30000}
      # Single-thread lifecycle demo (Task #33 / design 9.2): one dedicated thread
      # really walks NEW -> RUNNABLE -> BLOCKED -> WAITING -> TIMED_WAITING ->
      # TERMINATED. auto-advance-interval-ms paces the automatic walk (freeze stops
      # it, resume re-arms from the frozen step); monitor-hold-ms is the real
      # BLOCKED window created by a helper thread; timed-wait-ms is the sleep of
      # the TIMED_WAITING stage. Naming: its gauge is thread_lab_demo_state_code
      # (0-5). thread_lab_lifecycle_state_code stays the FAULT action lifecycle
      # (0 stopped / 1 active / 2 paused) and is unchanged.
      lifecycle:
        enabled: ${LAB_THREAD_LIFECYCLE_ENABLED:true}
        thread-name: ${LAB_THREAD_LIFECYCLE_THREAD_NAME:thread-lab-demo}
        monitor-thread-name: ${LAB_THREAD_LIFECYCLE_MONITOR_THREAD_NAME:thread-lab-demo-monitor}
        auto-advance-interval-ms: ${LAB_THREAD_LIFECYCLE_AUTO_ADVANCE_INTERVAL_MS:2000}
        monitor-hold-ms: ${LAB_THREAD_LIFECYCLE_MONITOR_HOLD_MS:1200}
        monitor-acquire-timeout-ms: ${LAB_THREAD_LIFECYCLE_MONITOR_ACQUIRE_TIMEOUT_MS:5000}
        timed-wait-ms: ${LAB_THREAD_LIFECYCLE_TIMED_WAIT_MS:1500}
        # At least 4 (the advances needed to reach TERMINATED); reset to run again.
        max-steps: ${LAB_THREAD_LIFECYCLE_MAX_STEPS:6}
        # reset() joins the demo thread; must exceed monitor-hold-ms (startup guard).
        shutdown-join-timeout-ms: ${LAB_THREAD_LIFECYCLE_SHUTDOWN_JOIN_TIMEOUT_MS:3000}
      # Snapshot bundle (design 9.3). freeze and POST /lab/thread/snapshot write
      # `jcmd Thread.print -l`, `GC.heap_info` and `GC.class_histogram` into
      # <root-dir>/<UTC timestamp>_<instance>/ with metadata.json and a copy of
      # the analysis template. jcmd runs inside the app container against this
      # JVM's own pid; the runtime image is a JDK, so the tools exist. Retention
      # is bounded by max-count and max-age-seconds (0 disables the age rule).
      # The Grafana annotation is best-effort and OFF while grafana-url is empty.
      snapshot:
        enabled: ${LAB_THREAD_SNAPSHOT_ENABLED:true}
        # Runtime path; inside the container this is /app/doc/process/snapshots
        # (in-container filesystem until a compose volume is added).
        root-dir: ${LAB_THREAD_SNAPSHOT_DIR:doc/process/snapshots}
        max-count: ${LAB_THREAD_SNAPSHOT_MAX_COUNT:20}
        max-age-seconds: ${LAB_THREAD_SNAPSHOT_MAX_AGE_SECONDS:604800}
        command-timeout-ms: ${LAB_THREAD_SNAPSHOT_COMMAND_TIMEOUT_MS:5000}
        jcmd-path: ${LAB_THREAD_SNAPSHOT_JCMD:jcmd}
        annotation:
          enabled: ${LAB_THREAD_SNAPSHOT_ANNOTATION_ENABLED:true}
          # Empty means OFF (the snapshot is still written and the skip counted).
          # Compose currently passes Grafana credentials to the chaos-controller
          # only; wire these variables for the app tier in a later step.
          grafana-url: ${LAB_THREAD_SNAPSHOT_GRAFANA_URL:}
          user: ${GRAFANA_ADMIN_USER:}
          password: ${GRAFANA_ADMIN_PASSWORD:}
          timeout-seconds: ${LAB_THREAD_SNAPSHOT_ANNOTATION_TIMEOUT_SECONDS:3}
          tags: ${LAB_THREAD_SNAPSHOT_ANNOTATION_TAGS:}

  # Runtime experiment toggles (Task 17). Per-instance, in-memory and mutable
  # through POST /lab/toggles; the chaos-controller will broadcast later.
  # mq is seeded by the Task 16 startup switch so the old env var still works
  # when LAB_TOGGLE_MQ is not set.
  toggles:
    lock: ${LAB_TOGGLE_LOCK:true}
    idempotency: ${LAB_TOGGLE_IDEMPOTENCY:true}
    mq: ${LAB_TOGGLE_MQ:${SECKILL_ASYNC_ENABLED:true}}
    ratelimit: ${LAB_TOGGLE_RATELIMIT:true}
    circuitbreaker: ${LAB_TOGGLE_CIRCUITBREAKER:true}
    cache: ${LAB_TOGGLE_CACHE:true}

  # Async seckill admission (Task 16). Every path, timeout, TTL, key prefix,
  # queue/exchange name, pacing delay and pool size is externalized here and
  # overridable through the environment; no runtime value is hardcoded in Java.
  seckill:
    async-enabled: ${SECKILL_ASYNC_ENABLED:true}
    lock:
      key-prefix: ${SECKILL_LOCK_KEY_PREFIX:lock:seckill:}
      wait-ms: ${SECKILL_LOCK_WAIT_MS:500}
      lease-ms: ${SECKILL_LOCK_LEASE_MS:3000}
    stock:
      key-prefix: ${SECKILL_STOCK_KEY_PREFIX:seckill:stock:}
      seed-on-startup: ${SECKILL_STOCK_SEED_ON_STARTUP:true}
      lua-path: ${SECKILL_STOCK_LUA_PATH:lua/seckill_stock.lua}
    request:
      key-prefix: ${SECKILL_REQUEST_KEY_PREFIX:seckill:request:}
      ttl-seconds: ${SECKILL_REQUEST_TTL_SECONDS:1800}
    idempotency:
      key-prefix: ${SECKILL_IDEMPOTENCY_KEY_PREFIX:seckill:idem:}
      ttl-seconds: ${SECKILL_IDEMPOTENCY_TTL_SECONDS:1800}
    mq:
      exchange: ${SECKILL_MQ_EXCHANGE:seckill.order.exchange}
      queue: ${SECKILL_MQ_QUEUE:seckill.order.queue}
      routing-key: ${SECKILL_MQ_ROUTING_KEY:seckill.order.requested}
    consumer:
      delay-ms: ${SECKILL_CONSUMER_DELAY_MS:20}
    redisson:
      connect-timeout-ms: ${SECKILL_REDISSON_CONNECT_TIMEOUT_MS:3000}
      timeout-ms: ${SECKILL_REDISSON_TIMEOUT_MS:3000}
      retry-attempts: ${SECKILL_REDISSON_RETRY_ATTEMPTS:3}
      retry-interval-ms: ${SECKILL_REDISSON_RETRY_INTERVAL_MS:1000}
      connection-minimum-idle-size: ${SECKILL_REDISSON_MIN_IDLE:2}
      connection-pool-size: ${SECKILL_REDISSON_POOL_SIZE:8}
      # No Redis connection at startup: a Redis outage must not block boot
      # (Task 14 health/degradation contract) and RedisOutageCacheIT proves it.
      lazy-initialization: ${SECKILL_REDISSON_LAZY_INIT:true}
      # --- Sentinel-mode knobs (Task M3-1b). Defaults fall back to the generic
      # keys above, so standalone behaviour and the existing env overrides are
      # unchanged; set the dedicated SECKILL_REDISSON_MASTER_*/SLAVE_* vars only
      # to size the ha demo pools differently. ---
      idle-connection-timeout-ms: ${SECKILL_REDISSON_IDLE_CONNECTION_TIMEOUT_MS:10000}
      scan-interval-ms: ${SECKILL_REDISSON_SCAN_INTERVAL_MS:1000}
      # MASTER = reads/ writes all go to the discovered master (strongly
      # consistent demo semantics); switch to MASTER_SLAVE/SLAVE for the
      # read-scaling variant without a code change.
      read-mode: ${SECKILL_REDISSON_READ_MODE:MASTER}
      master-connection-minimum-idle-size: ${SECKILL_REDISSON_MASTER_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      master-connection-pool-size: ${SECKILL_REDISSON_MASTER_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      slave-connection-minimum-idle-size: ${SECKILL_REDISSON_SLAVE_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      slave-connection-pool-size: ${SECKILL_REDISSON_SLAVE_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      subscription-connection-pool-size: ${SECKILL_REDISSON_SUBSCRIPTION_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}

# Resilience4j (Task 17). The Boot 3 starter binds these instances into the
# registries; the admission service resolves them and executes them manually so
# the runtime toggles can skip protection. Only BusinessException (sold out,
# lock timeout) is ignored: the plain BizException 50301 that Task 16 uses to
# wrap Redis/MQ/stock/publish faults IS counted, so a real infrastructure
# outage accumulates the failure rate and opens the circuit (SeckillResilience-
# ConfigIT proves this with the production config). The ignore check is
# configuredClass.isAssignableFrom(thrownClass), so ignoring the subclass
# BusinessException does not swallow its parent BizException.
resilience4j:
  ratelimiter:
    instances:
      seckill:
        limit-for-period: ${SECKILL_RATE_LIMIT_PER_PERIOD:50}
        limit-refresh-period: ${SECKILL_RATE_LIMIT_REFRESH:1s}
        timeout-duration: ${SECKILL_RATE_LIMIT_TIMEOUT:0}
  circuitbreaker:
    instances:
      seckillBackend:
        sliding-window-size: ${SECKILL_CB_WINDOW:10}
        failure-rate-threshold: ${SECKILL_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${SECKILL_CB_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${SECKILL_CB_HALF_OPEN:3}
        # Resilience4j's default (100) can never be reached inside a 10-call
        # window, so the circuit would never open. Five calls are enough to
        # calculate an honest rate and keep the demo observable.
        minimum-number-of-calls: ${SECKILL_CB_MIN_CALLS:5}
        ignore-exceptions:
          - com.javalearn.lab.common.BusinessException

server:
  port: 8080
  # Boot 3 disables the Tomcat MBean registry by default; D2 reads
  # tomcat_threads_busy_threads, so the lab app opts back in.
  tomcat:
    mbeanregistry:
      enabled: true

observability:
  env: dev
  instance: ${INSTANCE_ID:app-local}

management:
  metrics:
    distribution:
      # D4 order-accept SLO (Task 18). The seckill admission timer is already
      # named order_accept_seconds; enabling the percentile histogram exports
      # order_accept_seconds_bucket for histogram_quantile P95/P99 and the SLO
      # buckets (50ms..2s) without changing timer code. Both values are
      # externalized; ORDER_ACCEPT_SLO is a comma-separated bucket list.
      percentiles-histogram:
        order_accept_seconds: true
      slo:
        order_accept_seconds: ${ORDER_ACCEPT_SLO:50ms,100ms,300ms,500ms,1s,2s}
  health:
    # An OPEN circuit or an empty rate-limiter budget is a lab result, not an
    # application failure: keep it out of /actuator/health (and the container
    # gate), otherwise Docker would mark a deliberately degraded instance
    # unhealthy and Nginx would drop it mid-experiment.
    circuitbreakers:
      enabled: false
    ratelimiters:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Container health gate (compose healthcheck hits /actuator/health/app).
        # Empty include + exclude=redis means "every contributor except Redis"
        # (Spring Boot IncludeExcludeGroupMemberPredicate). Redis is the
        # best-effort product cache L2: during a Redis outage reads degrade to
        # MySQL and the instance must stay healthy for Docker and for the
        # design §8.2 / §15 scenario 8 failover demos. The root
        # /actuator/health still reports Redis honestly (DOWN -> 503), so this
        # does not hide the failure, it only scopes the container gate.
        app:
          exclude:
            - redis
