# =============================================================================
# seckill-app-jdk8 — EOL teaching shell (design section 10, D7 JDK comparison).
# Every runtime path, port, pool size and timeout is a ${ENV:default}
# placeholder (工程规约 section 1); nothing here is fixed in Java code.
# Profiles: demo (default, H2 in memory, boots with NO external services so
# startup time is comparable) and mysql (the shared lab database).
# =============================================================================
spring:
  application:
    name: ${APP_NAME:seckill-app-jdk8}
  profiles:
    active: ${APP_PROFILE:demo}
  lifecycle:
    # pairs with server.shutdown=graceful below
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT_PER_PHASE:30s}

  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate.jdbc.time_zone: ${JPA_JDBC_TIME_ZONE:UTC}

  # Redis backs the async seckill stock/idempotency/request stores and the
  # Redisson per-product lock. Boot 2.7 uses spring.redis.* (Boot 3 moved it to
  # spring.data.redis.*); the env var NAMES match the JDK 21 peers, so one
  # compose environment works for all three instances. Connections are lazy, so
  # a Redis outage degrades the async path instead of preventing startup.
  # The sentinel.* subtree is deliberately NOT declared here: Boot 2.7 builds a
  # RedisSentinelConfiguration as soon as any spring.redis.sentinel key exists,
  # and an empty master name aborts EVERY startup (demo included). Sentinel mode
  # therefore requires the standard SPRING_REDIS_SENTINEL_MASTER / _NODES /
  # _PASSWORD environment variables, exactly like the JDK 21 shell requires its
  # SPRING_DATA_REDIS_SENTINEL_* pair.
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}

  # Async seckill order queue: the same exchange/queue/routing key the JDK 21
  # instances use, so all three business slots share one admission stream. The
  # listener starts with the context in the mysql profile; the demo profile
  # disables auto-startup because it boots without a broker.
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:4}
        prefetch: ${RABBITMQ_CONSUMER_PREFETCH:20}
        # A failed seckill message is compensated and marked FAILED; never
        # requeue it in an infinite loop.
        default-requeue-rejected: false

  # demo/mysql override these per profile below; the locations stay external so
  # an operator can point at another seed script without a rebuild.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: ${SQL_INIT_ENCODING:UTF-8}
      platform: ${SQL_INIT_PLATFORM:h2}
      schema-locations: ${SQL_SCHEMA_LOCATIONS:classpath:schema.sql}
      data-locations: ${SQL_DATA_LOCATIONS:classpath:data.sql}

  datasource:
    hikari:
      pool-name: ${DB_POOL_NAME:seckill-jdk8-pool}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  tomcat:
    # D2/D7 read tomcat_threads_busy_threads; Boot 2 keeps the MBean registry on
    # by default, the switch is here so both shells expose the same knob.
    mbeanregistry:
      enabled: ${TOMCAT_MBEAN_REGISTRY_ENABLED:true}
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT_MS:20000}

# Internal lab API (design 9.3): token-guarded jstack/jmap snapshot bundles.
# The JDK 8 shell had no lab API before this; the token is the same shared
# secret the JDK 21 shell and the chaos-controller use, so one .env value works
# for both runtimes. Nginx does not proxy /lab/**, only in-network callers reach
# it (the chaos-controller narrow proxy exposes it to the console).
app:
  # Redis client mode switch (design §3.3), identical to the JDK 21 shell:
  # standalone = the single-node lab Redis (spring.redis.host/port), sentinel =
  # discover the master BY NAME through spring.redis.sentinel.* (supplied only
  # by the environment, never defaulted here). ONE env var moves both the
  # Lettuce (StringRedisTemplate) and Redisson stacks; any other value fails
  # startup. The JDK 21-only Sentinel discovery-log reporter is not ported, so
  # its REDIS_DISCOVERY_REPORT_* knobs are deliberately absent here: this module
  # declares no tuning value without a consumer (工程规约 §1).
  redis:
    mode: ${REDIS_MODE:standalone}

  # Runtime experiment toggles (Task 17), seeded exactly like the JDK 21 shell.
  # Per-instance, in-memory and mutable there through POST /lab/toggles; the
  # async admission here reads the same seeds so the three instances start in
  # the same protection state. mq is seeded by the async startup switch so the
  # old env var still works when LAB_TOGGLE_MQ is not set.
  toggles:
    lock: ${LAB_TOGGLE_LOCK:true}
    idempotency: ${LAB_TOGGLE_IDEMPOTENCY:true}
    mq: ${LAB_TOGGLE_MQ:${SECKILL_ASYNC_ENABLED:true}}
    ratelimit: ${LAB_TOGGLE_RATELIMIT:true}
    circuitbreaker: ${LAB_TOGGLE_CIRCUITBREAKER:true}
    cache: ${LAB_TOGGLE_CACHE:true}

  # B4-01 bounded business executor (design §4.4/§16.5): the controlled,
  # bounded hop between the Rabbit listener and the seckill order consumer.
  # Every value is a startup parameter, so a change requires the controlled
  # restart and is read back by the console with the same names and defaults as
  # the JDK 21 peers.
  business-pool:
    core-pool-size: ${BUSINESS_POOL_CORE_SIZE:4}
    max-pool-size: ${BUSINESS_POOL_MAX_SIZE:8}
    queue-capacity: ${BUSINESS_POOL_QUEUE_CAPACITY:50}
    keep-alive-seconds: ${BUSINESS_POOL_KEEP_ALIVE_SECONDS:60}
    # AbortPolicy | CallerRunsPolicy | DiscardPolicy | DiscardOldestPolicy.
    rejection-policy: ${BUSINESS_POOL_REJECTION_POLICY:AbortPolicy}
    # Prefix of the worker thread names, visible in thread dumps.
    thread-name-prefix: ${BUSINESS_POOL_THREAD_NAME_PREFIX:business-pool}

  # Async seckill admission. Every path, timeout, TTL, key prefix,
  # queue/exchange name, pacing delay and pool size is externalized here with
  # the SAME env var names and defaults as the JDK 21 shell, so the three
  # instances read one configuration contract. The Redis keys are shared on
  # purpose: stock, idempotency and request state belong to the product, not to
  # one instance.
  seckill:
    async-enabled: ${SECKILL_ASYNC_ENABLED:true}
    lock:
      key-prefix: ${SECKILL_LOCK_KEY_PREFIX:lock:seckill:}
      wait-ms: ${SECKILL_LOCK_WAIT_MS:500}
      lease-ms: ${SECKILL_LOCK_LEASE_MS:3000}
    stock:
      key-prefix: ${SECKILL_STOCK_KEY_PREFIX:seckill:stock:}
      seed-on-startup: ${SECKILL_STOCK_SEED_ON_STARTUP:true}
      lua-path: ${SECKILL_STOCK_LUA_PATH:lua/seckill_stock.lua}
    request:
      key-prefix: ${SECKILL_REQUEST_KEY_PREFIX:seckill:request:}
      ttl-seconds: ${SECKILL_REQUEST_TTL_SECONDS:1800}
    idempotency:
      key-prefix: ${SECKILL_IDEMPOTENCY_KEY_PREFIX:seckill:idem:}
      ttl-seconds: ${SECKILL_IDEMPOTENCY_TTL_SECONDS:1800}
    mq:
      exchange: ${SECKILL_MQ_EXCHANGE:seckill.order.exchange}
      queue: ${SECKILL_MQ_QUEUE:seckill.order.queue}
      routing-key: ${SECKILL_MQ_ROUTING_KEY:seckill.order.requested}
      # Canonical __TypeId__ written by this runtime. It is the JDK 21 class
      # name on purpose: the three instances share one queue, so app-3 must
      # publish a type id the JDK 21 peers can resolve (and it consumes by the
      # listener's inferred type, so the reverse direction works too).
      type-id: ${SECKILL_MQ_TYPE_ID:com.javalearn.lab.seckill.admission.domain.SeckillOrderMessage}
    consumer:
      delay-ms: ${SECKILL_CONSUMER_DELAY_MS:20}
    redisson:
      connect-timeout-ms: ${SECKILL_REDISSON_CONNECT_TIMEOUT_MS:3000}
      timeout-ms: ${SECKILL_REDISSON_TIMEOUT_MS:3000}
      retry-attempts: ${SECKILL_REDISSON_RETRY_ATTEMPTS:3}
      retry-interval-ms: ${SECKILL_REDISSON_RETRY_INTERVAL_MS:1000}
      connection-minimum-idle-size: ${SECKILL_REDISSON_MIN_IDLE:2}
      connection-pool-size: ${SECKILL_REDISSON_POOL_SIZE:8}
      # No Redis connection at startup: a Redis outage must not block boot
      # (Task 14 health/degradation contract).
      lazy-initialization: ${SECKILL_REDISSON_LAZY_INIT:true}
      # --- Sentinel-mode knobs. Defaults fall back to the generic keys above,
      # so standalone behaviour and the existing env overrides are unchanged. ---
      idle-connection-timeout-ms: ${SECKILL_REDISSON_IDLE_CONNECTION_TIMEOUT_MS:10000}
      scan-interval-ms: ${SECKILL_REDISSON_SCAN_INTERVAL_MS:1000}
      # MASTER = reads/writes all go to the discovered master (strongly
      # consistent demo semantics); switch to MASTER_SLAVE/SLAVE for the
      # read-scaling variant without a code change.
      read-mode: ${SECKILL_REDISSON_READ_MODE:MASTER}
      master-connection-minimum-idle-size: ${SECKILL_REDISSON_MASTER_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      master-connection-pool-size: ${SECKILL_REDISSON_MASTER_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      slave-connection-minimum-idle-size: ${SECKILL_REDISSON_SLAVE_MIN_IDLE:${SECKILL_REDISSON_MIN_IDLE:2}}
      slave-connection-pool-size: ${SECKILL_REDISSON_SLAVE_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}
      subscription-connection-pool-size: ${SECKILL_REDISSON_SUBSCRIPTION_POOL_SIZE:${SECKILL_REDISSON_POOL_SIZE:8}}

  login:
    # Mock login parity with the JDK 21 peers: the UUID token is stored as
    # <prefix><token> -> userId in the SHARED Redis (verify.sh logs in through
    # Nginx, so one third of those probes land here). Same keys, env names and
    # defaults as the JDK 21 shell.
    token-key-prefix: ${LOGIN_TOKEN_KEY_PREFIX:login:token:}
    token-ttl-seconds: ${LOGIN_TOKEN_TTL_SECONDS:1800}
  lab:
    token: ${LAB_TOKEN:lab-token}

    # Cache experiment (design 8.4), byte-for-byte the same contract as the
    # JDK 21 peers: the same property keys, the same LAB_CACHE_* env names and
    # the same defaults, so app-3 is interchangeable with app-1/app-2 for the
    # cache-lab scenario and for GET /lab/config. /lab/cache/seed generates the
    # dataset in a RESERVED id range above protected-max-id, so the demo
    # products (1 and 20) that verify.sh / smoke.sh / reset-lab.sh assert on are
    # never written. Counts, id range, TTLs, jitter, batch size, SCAN hint and
    # the bloom geometry are all here; nothing is hardcoded in Java.
    cache:
      seed:
        # 1000 experiment products, ids 90000..90999 by default.
        product-count: ${LAB_CACHE_SEED_PRODUCT_COUNT:1000}
        # Upper bound of one POST /lab/cache/seed {"count":N} request (B3-02).
        max-request-count: ${LAB_CACHE_SEED_MAX_REQUEST_COUNT:10000}
        start-id: ${LAB_CACHE_SEED_START_ID:90000}
        # Highest id that belongs to the built-in demo baseline; seeding must
        # start above it.
        protected-max-id: ${LAB_CACHE_SEED_PROTECTED_MAX_ID:10000}
        # M4-2/M4-3 avalanche set: this many keys are warmed with ONE identical
        # TTL so they expire in the same second.
        avalanche-key-count: ${LAB_CACHE_SEED_AVALANCHE_KEY_COUNT:200}
        avalanche-ttl-seconds: ${LAB_CACHE_SEED_AVALANCHE_TTL_SECONDS:60}
        # One designated hot key, addressed as an offset inside the range. It
        # must sit at or after avalanche-key-count: it is warmed with its own
        # TTL, so an offset inside the avalanche range would overwrite an
        # identically-expiring key (rejected by startup validation).
        hot-key-index: ${LAB_CACHE_SEED_HOT_KEY_INDEX:999}
        hot-key-ttl-seconds: ${LAB_CACHE_SEED_HOT_KEY_TTL_SECONDS:300}
        write-batch-size: ${LAB_CACHE_SEED_WRITE_BATCH_SIZE:200}
        name-prefix: ${LAB_CACHE_SEED_NAME_PREFIX:实验商品}
        status: ${LAB_CACHE_SEED_STATUS:ON_SALE}
        price: ${LAB_CACHE_SEED_PRICE:99.00}
      state:
        # Redis SCAN COUNT hint used by GET /lab/cache/state to count live keys.
        scan-count: ${LAB_CACHE_STATE_SCAN_COUNT:500}
      # SCAN-only key browser (GET /lab/cache/keys) and experiment reset
      # (POST /lab/cache/reset). The prefix allow-list is closed so the endpoint
      # can never dump the whole keyspace; max-limit is the hard page cap and
      # reset-max-keys bounds one destructive call on the 10k dataset.
      keys:
        default-prefix: ${LAB_CACHE_KEYS_DEFAULT_PREFIX:cache:product:}
        allowed-prefixes: ${LAB_CACHE_KEYS_ALLOWED_PREFIXES:cache:product:}
        default-limit: ${LAB_CACHE_KEYS_DEFAULT_LIMIT:100}
        max-limit: ${LAB_CACHE_KEYS_MAX_LIMIT:1000}
        scan-count: ${LAB_CACHE_KEYS_SCAN_COUNT:500}
        # Bounded batches per page so a sparse prefix still fills the page.
        scan-batches: ${LAB_CACHE_KEYS_SCAN_BATCHES:20}
        value-max-bytes: ${LAB_CACHE_KEYS_VALUE_MAX_BYTES:2048}
        reset-scan-count: ${LAB_CACHE_KEYS_RESET_SCAN_COUNT:1000}
        reset-max-keys: ${LAB_CACHE_KEYS_RESET_MAX_KEYS:50000}
      # TwoLevelCache's own Redis L2 write side. The prefix is the L2 key LAYOUT
      # contract: the cache, the experiment seeder, GET /lab/cache/state, the
      # preheat service and the TTL-jitter adjuster all resolve it from this
      # single key (TwoLevelCacheSettings), so re-pointing it moves every reader
      # and writer together.
      l2:
        ttl-seconds: ${LAB_CACHE_L2_TTL_SECONDS:300}
        key-prefix: ${LAB_CACHE_L2_KEY_PREFIX:cache:}
        clear-scan-count: ${LAB_CACHE_L2_CLEAR_SCAN_COUNT:500}
      penetration:
        # Startup seed of the runtime mode; POST /lab/cache/mode switches it
        # without a restart. off is the unprotected symptom state the lab starts
        # in. Since M4-2 this key seeds ALL defense modes.
        mode: ${LAB_CACHE_DEFENSE_MODE:off}
        null-cache:
          key-prefix: ${LAB_CACHE_NULL_KEY_PREFIX:null:product:}
          # Short TTL because a marker only promises "absent so far"; the jitter
          # keeps a miss burst from expiring in lockstep with the avalanche keys.
          ttl-seconds: ${LAB_CACHE_NULL_TTL_SECONDS:10}
          jitter-seconds: ${LAB_CACHE_NULL_JITTER_SECONDS:5}
        bloom:
          key: ${LAB_CACHE_BLOOM_KEY:bloom:product-ids}
          # Capacity covers the demo products plus the experiment range with
          # room for growth; re-seeding rebuilds the filter from the real ids.
          expected-insertions: ${LAB_CACHE_BLOOM_EXPECTED_INSERTIONS:10000}
          false-probability: ${LAB_CACHE_BLOOM_FALSE_PROBABILITY:0.01}
      # 击穿 (hot-key breakdown) defense, design 8.4. Same runtime switch as the
      # penetration modes; every lock time, TTL, bound and pool number is here.
      breakdown:
        mutex:
          # Redisson lock per key (prefix + id); one holder rebuilds, waiters
          # double-check L2/stale before touching the DB. lease-ms >= wait-ms is
          # enforced at startup.
          key-prefix: ${LAB_CACHE_MUTEX_KEY_PREFIX:lock:product:}
          wait-ms: ${LAB_CACHE_MUTEX_WAIT_MS:200}
          lease-ms: ${LAB_CACHE_MUTEX_LEASE_MS:2000}
          # What a waiter whose lock wait timed out does: db = honestly query
          # the database (default), stale = serve the retained value if one
          # exists, else still db. This is the visible P99 cost knob.
          on-lock-timeout: ${LAB_CACHE_MUTEX_ON_LOCK_TIMEOUT:db}
        logical-expire:
          # Value keeps its own logical TTL; after that it is served stale for
          # up to retention-seconds (physical window, must be larger) while ONE
          # async refresh rebuilds it and publishes the fresh value back into
          # the shared cache. retention-seconds must ALSO exceed
          # seed.hot-key-ttl-seconds, enforced at startup.
          logical-ttl-seconds: ${LAB_CACHE_LOGICAL_TTL_SECONDS:30}
          retention-seconds: ${LAB_CACHE_LOGICAL_RETENTION_SECONDS:600}
          # Per-instance bounded stale store; a key storm cannot grow it.
          max-entries: ${LAB_CACHE_LOGICAL_MAX_ENTRIES:10000}
          # Bounded refresh pool; saturation is counted as
          # cache_breakdown_refresh{result="rejected"} and stale keeps serving.
          refresh-pool-size: ${LAB_CACHE_LOGICAL_REFRESH_POOL_SIZE:2}
          refresh-queue-capacity: ${LAB_CACHE_LOGICAL_REFRESH_QUEUE_CAPACITY:100}
          keep-alive-seconds: ${LAB_CACHE_LOGICAL_REFRESH_KEEP_ALIVE_SECONDS:60}
          thread-name-prefix: ${LAB_CACHE_LOGICAL_REFRESH_THREAD_PREFIX:breakdown-refresh}
      # 雪崩 (cache avalanche) defense, design 8.4 row three. Three strategies on
      # the same runtime switch: ttl-jitter spreads every product L2 write by
      # ±percent; l1-cache is the L1-first posture; db-fallback bounds database
      # reads with a fixed permits/period budget and fast fails with 42901.
      avalanche:
        ttl-jitter:
          percent: ${LAB_CACHE_TTL_JITTER_PERCENT:20}
        l1-cache:
          # A value is fresh this long; after that it is served stale while ONE
          # async refresh rebuilds it. Design 8.4: refresh interval 10s.
          refresh-interval-seconds: ${LAB_CACHE_L1_REFRESH_INTERVAL_SECONDS:10}
          # Worst-case staleness of the L1-first posture (design 8.4: L1 TTL).
          stale-window-seconds: ${LAB_CACHE_L1_STALE_WINDOW_SECONDS:60}
          # Per-instance bounded mirror; a key storm cannot grow it.
          max-entries: ${LAB_CACHE_L1_MAX_ENTRIES:10000}
          # Bounded refresh pool; saturation is counted as
          # cache_avalanche_l1_refresh{result="rejected"} and stale keeps serving.
          refresh-pool-size: ${LAB_CACHE_L1_REFRESH_POOL_SIZE:2}
          refresh-queue-capacity: ${LAB_CACHE_L1_REFRESH_QUEUE_CAPACITY:100}
          keep-alive-seconds: ${LAB_CACHE_L1_KEEP_ALIVE_SECONDS:60}
          thread-name-prefix: ${LAB_CACHE_L1_REFRESH_THREAD_PREFIX:avalanche-l1-refresh}
        db-fallback:
          # At most this many database reads per period across all avalanche
          # traffic; the rest fail fast with 42901. Both numbers validated.
          permits: ${LAB_CACHE_DB_FALLBACK_PERMITS:50}
          period-ms: ${LAB_CACHE_DB_FALLBACK_PERIOD_MS:1000}
      # Caffeine 预热 (M4-3, design 8.4). The hot-key tracker is per instance and
      # capped; the Top-N is published to ONE shared Redis ZSet so every instance
      # preheats from the same list. Startup/periodic preheat warms L1 from L2
      # only — it never rewrites cache:product:<id> TTLs.
      preheat:
        # Gates the automatic startup + periodic runs. Hot-key tracking and
        # publishing stay active, and POST /lab/cache/preheat stays available.
        enabled: ${LAB_CACHE_PREHEAT_ENABLED:true}
        top-n: ${LAB_CACHE_PREHEAT_TOP_N:200}
        hot-list-key: ${LAB_CACHE_PREHEAT_HOT_LIST_KEY:hot:products}
        tracker:
          # Caffeine cap on tracked product ids (design 8.4: 10 万).
          capacity: ${LAB_CACHE_PREHEAT_TRACKER_CAPACITY:100000}
          # Counters halve once per interval (design 8.4: 30s).
          decay-interval-seconds: ${LAB_CACHE_PREHEAT_TRACKER_DECAY_INTERVAL_SECONDS:30}
          # How often the local Top-N replaces the shared ZSet.
          flush-interval-seconds: ${LAB_CACHE_PREHEAT_TRACKER_FLUSH_INTERVAL_SECONDS:10}
        load:
          # Rate limit: this many L2 reads, then chunk-pause-ms of sleep.
          chunk-size: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_SIZE:50}
          chunk-pause-ms: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_PAUSE_MS:50}
          # The startup run is async after ApplicationReadyEvent, never during boot.
          startup-delay-ms: ${LAB_CACHE_PREHEAT_STARTUP_DELAY_MS:1000}
          # Incremental reheat period (design 8.4: 5 minutes).
          periodic-interval-seconds: ${LAB_CACHE_PREHEAT_PERIODIC_INTERVAL_SECONDS:300}
          scheduler-pool-size: ${LAB_CACHE_PREHEAT_SCHEDULER_POOL_SIZE:1}
          thread-name-prefix: ${LAB_CACHE_PREHEAT_THREAD_PREFIX:cache-preheat}
        # Externalized Caffeine L1 geometry (the former TwoLevelCache constants).
        l1:
          maximum-size: ${LAB_CACHE_L1_MAXIMUM_SIZE:10000}
          refresh-after-write-seconds: ${LAB_CACHE_L1_REFRESH_AFTER_WRITE_SECONDS:10}
          expire-after-write-seconds: ${LAB_CACHE_L1_EXPIRE_AFTER_WRITE_SECONDS:60}
          # Register the Caffeine-native L1 stats series (cache_l1_caffeine_*,
          # cache_l1_estimated_size) with Micrometer for every L1 instance.
          micrometer-stats-enabled: ${LAB_CACHE_L1_MICROMETER_STATS_ENABLED:true}
          # Startup state of the per-JVM Caffeine switch; POST /lab/cache/l1 can
          # still flip it at runtime.
          enabled: ${LAB_CACHE_L1_ENABLED:true}
          # Idle expiry of an L1 entry, in seconds (0 = disabled).
          expire-after-access-seconds: ${LAB_CACHE_L1_EXPIRE_AFTER_ACCESS_SECONDS:0}

    snapshot:
      enabled: ${LAB_SNAPSHOT_ENABLED:true}
      # Container path of the host mount doc/process/Stage1/snapshots (compose.base.yml).
      # Both runtimes write into the same root; this shell uses instance app-jdk8,
      # so its bundles sit next to the JDK 21 app-1/2/3 bundles.
      root-dir: ${LAB_SNAPSHOT_DIR:/app/lab-snapshots}
      max-count: ${LAB_SNAPSHOT_MAX_COUNT:20}
      # 0 disables age-based pruning; count-based retention always applies.
      max-age-seconds: ${LAB_SNAPSHOT_MAX_AGE_SECONDS:604800}
      # Per tool invocation (jstack, then jcmd GC.heap_info, then jmap -histo).
      command-timeout-ms: ${LAB_SNAPSHOT_COMMAND_TIMEOUT_MS:5000}
      # histo (default, no GC) or histo-live. -histo:live forces a full GC and
      # therefore changes the heap the snapshot is meant to observe; opt in only
      # for "is this object really live?" investigations.
      jmap-mode: ${LAB_SNAPSHOT_JMAP_MODE:histo}
      # JDK 8 tools from the jdk-alpine runtime image (on PATH), overridable.
      jstack-path: ${LAB_SNAPSHOT_JSTACK_PATH:jstack}
      jmap-path: ${LAB_SNAPSHOT_JMAP_PATH:jmap}
      # jmap -heap was removed in 8u, so heap-info.txt comes from
      # `jcmd <pid> GC.heap_info` (the same diagnostic the JDK 21 bundle uses).
      jcmd-path: ${LAB_SNAPSHOT_JCMD_PATH:jcmd}
      # Reuses the repository template instead of forking a copy into resources;
      # compose bind-mounts doc/process/Stage1/snapshot-analysis-template.md read-only.
      template-path: ${LAB_SNAPSHOT_TEMPLATE_PATH:doc/process/Stage1/snapshot-analysis-template.md}
      # Best-effort Grafana marker of a successful capture (same wire contract
      # as the JDK 21 shell: POST /api/annotations, basic auth, {time,tags,text}).
      # A blank url is OFF: the bundle is still written and the skip is counted
      # in thread_lab_snapshot_annotations_total{result="skipped"}.
      annotation:
        enabled: ${LAB_SNAPSHOT_ANNOTATION_ENABLED:true}
        url: ${LAB_SNAPSHOT_GRAFANA_URL:}
        user: ${GRAFANA_ADMIN_USER:}
        password: ${GRAFANA_ADMIN_PASSWORD:}
        # Bounded so a hung Grafana can delay only this one POST, never the
        # capture (the bundle and its success metric are already recorded).
        connect-timeout-ms: ${LAB_SNAPSHOT_ANNOTATION_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${LAB_SNAPSHOT_ANNOTATION_READ_TIMEOUT_MS:3000}
        tags: ${LAB_SNAPSHOT_ANNOTATION_TAGS:}

observability:
  env: ${OBSERVABILITY_ENV:dev}
  instance: ${INSTANCE_ID:app-jdk8-local}

info:
  app:
    name: ${spring.application.name}
    runtime: ${INFO_RUNTIME:jre8}
    shell: ${INFO_SHELL:seckill-app-jdk8}
    purpose: ${INFO_PURPOSE:D7 dual-JDK comparison, EOL teaching-only}

# Resilience4j (Task 17), same instance names and values as the JDK 21 shell.
# The Boot 2 starter (resilience4j-spring-boot2 1.7.1) binds these instances into
# the registries; the admission service resolves and executes them manually so
# the runtime toggles can skip protection. Only BusinessException (sold out,
# lock timeout) is ignored: the plain BizException 50301 that wraps Redis/MQ/
# stock/publish faults IS counted, so a real infrastructure outage accumulates
# the failure rate and opens the circuit.
resilience4j:
  ratelimiter:
    instances:
      seckill:
        limit-for-period: ${SECKILL_RATE_LIMIT_PER_PERIOD:50}
        limit-refresh-period: ${SECKILL_RATE_LIMIT_REFRESH:1s}
        timeout-duration: ${SECKILL_RATE_LIMIT_TIMEOUT:0}
  circuitbreaker:
    instances:
      seckillBackend:
        sliding-window-size: ${SECKILL_CB_WINDOW:10}
        failure-rate-threshold: ${SECKILL_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${SECKILL_CB_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${SECKILL_CB_HALF_OPEN:3}
        # Resilience4j's default (100) can never be reached inside a 10-call
        # window, so the circuit would never open. Five calls are enough to
        # calculate an honest rate and keep the demo observable.
        minimum-number-of-calls: ${SECKILL_CB_MIN_CALLS:5}
        ignore-exceptions:
          - com.javalearn.lab.common.BusinessException

management:
  # Boot 2.7 keeps the info.* -> /actuator/info contributor OFF by default
  # (verified in the autoconfiguration report); turn it on so the endpoint
  # carries the runtime identity the D7 panel needs.
  info:
    env:
      enabled: ${INFO_ENV_CONTRIBUTOR_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: ${HEALTH_PROBES_ENABLED:true}
      group:
        # Same group name the JDK 21 shell exposes for the container gate
        # (/actuator/health/app), so the compose healthcheck is shared unchanged.
        # The gate stays the database plus the framework ping indicator: Redis
        # and RabbitMQ are best-effort (Redis outage -> async path degrades,
        # broker outage -> only the async admission is affected) and must never
        # mark a business instance unhealthy. The root /actuator/health still
        # reports both honestly in the mysql profile.
        app:
          include: ${HEALTH_GROUP_APP_INCLUDE:db,ping}
  health:
    # An OPEN circuit or an empty rate-limiter budget is a lab result, not an
    # application failure: keep it out of /actuator/health (and the container
    # gate), otherwise Docker would mark a deliberately degraded instance
    # unhealthy and Nginx would drop it mid-experiment.
    circuitbreakers:
      enabled: ${HEALTH_CIRCUITBREAKERS_ENABLED:false}
    ratelimiters:
      enabled: ${HEALTH_RATELIMITERS_ENABLED:false}
  metrics:
    tags:
      # Mirrors the common tags platform-observability adds to the JDK 21 shell
      # (that module is Boot 3 / jakarta and cannot be reused here), so the D7
      # queries hit identical label names on both runtimes.
      app: ${spring.application.name}
      env: ${observability.env}
      instance: ${observability.instance}
      "[jvm.version]": ${java.version}
    distribution:
      # P99 needs the histogram buckets (same settings the JDK 21 shell gets from
      # platform-observability's EnvironmentPostProcessor; declared here instead).
      percentiles-histogram:
        http.server.requests: ${HTTP_METRIC_PERCENTILES_HISTOGRAM:true}
        # D4 order-accept SLO (Task 18): the seckill admission timer is already
        # named order_accept_seconds, so the same histogram/SLO contract as the
        # JDK 21 shell applies without changing timer code.
        order_accept_seconds: true
      slo:
        http.server.requests: ${HTTP_METRIC_SLO_BUCKETS:50ms,100ms,200ms,300ms,500ms,800ms,1s,2s}
        order_accept_seconds: ${ORDER_ACCEPT_SLO:50ms,100ms,300ms,500ms,1s,2s}
      minimum-expected-value:
        http.server.requests: ${HTTP_METRIC_MIN_EXPECTED:50ms}
      maximum-expected-value:
        http.server.requests: ${HTTP_METRIC_MAX_EXPECTED:2s}

---
# demo profile: H2 in memory, schema.sql + data.sql seed, no external service.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DEMO_DB_URL:jdbc:h2:mem:seckill-jdk8;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
    username: ${DEMO_DB_USER:sa}
    password: ${DEMO_DB_PASSWORD:}
    driver-class-name: ${DEMO_DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
  rabbitmq:
    listener:
      simple:
        # No broker in the demo profile: the listener container must not start
        # (and RabbitAdmin must not declare the topology) so the context boots
        # with zero external services. The mysql profile keeps the default true.
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}

app:
  seckill:
    stock:
      # No Redis in the demo profile; the mysql/lab profiles seed from
      # inventory_stock as the JDK 21 shell does.
      seed-on-startup: ${SECKILL_STOCK_SEED_ON_STARTUP:false}

management:
  health:
    # The demo profile has no Redis or broker; disabling the two contributors
    # keeps root /actuator/health UP without weakening the mysql profile, where
    # both stay enabled and only the /app container gate excludes Redis.
    redis:
      enabled: ${HEALTH_REDIS_ENABLED:false}
    rabbit:
      enabled: ${HEALTH_RABBIT_ENABLED:false}

---
# mysql profile: the shared lab database (same tables the JDK 21 shell's Flyway
# migrations create, so the seed rows are identical by construction).
# Schema is NOT created here: the lab MySQL is owned by Flyway in seckill-app-jdk21.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:seckill}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:seckill}
    password: ${MYSQL_PASSWORD:seckill}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
