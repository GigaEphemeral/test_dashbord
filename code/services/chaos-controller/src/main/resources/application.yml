server:
  port: 8081

spring:
  application:
    name: chaos-controller

observability:
  env: dev
  instance: chaos-controller

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: health,info,prometheus

lab:
  # Local-lab shared secret; compose injects LAB_TOKEN. Never log this value.
  token: ${LAB_TOKEN:lab-token}
  docker:
    enabled: true
    # Docker Java transport limits; externalized so the lab can widen them
    # without a rebuild.
    max-connections: ${LAB_DOCKER_MAX_CONNECTIONS:16}
    connection-timeout-seconds: ${LAB_DOCKER_CONNECTION_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${LAB_DOCKER_RESPONSE_TIMEOUT_SECONDS:30}
  # Stage2 B4-01 per-instance JVM/GC/pool configuration. All numbers and
  # allow-lists are externalized; compose forwarding (B4-02) uses the same env
  # names. The memory budget is xmx + metaspace + direct + maxPoolSize*stack +
  # native reserve and must fit in memory-limit-mb.
  instance:
    names: ${LAB_INSTANCE_NAMES:app-1,app-2,app-3,seckill-app-jdk8}
    container-prefix: ${LAB_INSTANCE_CONTAINER_PREFIX:jl-}
    memory-limit-mb: ${LAB_INSTANCE_MEMORY_LIMIT_MB:768}
    thread-stack-mb: ${LAB_INSTANCE_THREAD_STACK_MB:1}
    native-reserve-mb: ${LAB_INSTANCE_NATIVE_RESERVE_MB:64}
    default-metaspace-mb: ${LAB_INSTANCE_DEFAULT_METASPACE_MB:96}
    default-direct-memory-mb: ${LAB_INSTANCE_DEFAULT_DIRECT_MEMORY_MB:64}
    max-extra-args: ${LAB_INSTANCE_MAX_EXTRA_ARGS:16}
    max-extra-args-length: ${LAB_INSTANCE_MAX_EXTRA_ARGS_LENGTH:1024}
    # Only verified image tags are accepted; UI options must come from here.
    image-tags: ${LAB_INSTANCE_IMAGE_TAGS:jdk21,jdk8}
    # GC-log/heap-dump paths must resolve inside this root; arbitrary paths are rejected.
    gc-log-root: ${LAB_INSTANCE_GC_LOG_ROOT:/app/lab-snapshots}
    gc-log-default-lines: ${LAB_INSTANCE_GC_LOG_DEFAULT_LINES:200}
    gc-log-max-lines: ${LAB_INSTANCE_GC_LOG_MAX_LINES:2000}
    gc-log-max-bytes: ${LAB_INSTANCE_GC_LOG_MAX_BYTES:262144}
    gc-log-tail-timeout-seconds: ${LAB_INSTANCE_GC_LOG_TAIL_TIMEOUT_SECONDS:5}
    # Stage2 B4-02 controlled rebuild: stable period, health gates and the
    # fixed image repository. The applied image ref is always
    # <image-repository>:<stored imageTag>; a request never supplies a repo/tag
    # and the controller never pulls. Every default matches the compose /
    # .env.example forward (LAB_INSTANCE_*), no rebuild needed to tune.
    stable-seconds: ${LAB_INSTANCE_STABLE_SECONDS:60}
    apply-timeout-seconds: ${LAB_INSTANCE_APPLY_TIMEOUT_SECONDS:240}
    health-timeout-seconds: ${LAB_INSTANCE_HEALTH_TIMEOUT_SECONDS:150}
    nginx-probe-url: ${LAB_INSTANCE_NGINX_PROBE_URL:http://nginx/api/hello}
    app-probe-url-template: ${LAB_INSTANCE_APP_PROBE_URL_TEMPLATE:http://%s:8080/api/hello}
    pool-probe-url-template: ${LAB_INSTANCE_POOL_PROBE_URL_TEMPLATE:http://%s:8080/lab/pool}
    probe-timeout-seconds: ${LAB_INSTANCE_PROBE_TIMEOUT_SECONDS:5}
    prometheus-up-wait-seconds: ${LAB_INSTANCE_PROMETHEUS_UP_WAIT_SECONDS:30}
    image-repository: ${LAB_INSTANCE_IMAGE_REPOSITORY:java-learn-lab/seckill-app}
    nginx-container: ${LAB_INSTANCE_NGINX_CONTAINER:jl-nginx}
  # Stage2 B1-01 ledger: run/operation/snapshot/fault/audit rows live in the
  # stack MySQL's dedicated `lab_ledger` database (standalone mysql:3306; db-ha
  # through mysql-router:6446, the same topology switch as the app tier and
  # reset-lab.sh). The controller starts even when MySQL is down: Hikari never
  # connects at pool creation, Flyway retries on a daemon scheduler, and a
  # failure only marks the ledger DEGRADED. Account: root, because the business
  # `seckill` account only owns seckill.* and cannot CREATE DATABASE; the
  # controller already holds the Docker socket, so this widens no boundary.
  # Passwords never appear in a URL and are never logged.
  ledger:
    enabled: ${LAB_LEDGER_ENABLED:true}
    mysql-mode: ${LAB_LEDGER_MYSQL_MODE:${MYSQL_MODE:standalone}}
    standalone-url: "${LAB_LEDGER_STANDALONE_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/lab_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    router-url: "${LAB_LEDGER_ROUTER_URL:jdbc:mysql://${MYSQL_ROUTER_HOST:mysql-router}:6446/lab_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    schema: ${LAB_LEDGER_SCHEMA:lab_ledger}
    user: ${LAB_LEDGER_USER:root}
    password: "${LAB_LEDGER_PASSWORD:${MYSQL_ROOT_PASSWORD:labroot}}"
    source-commit: ${LAB_SOURCE_COMMIT:unknown}
    operator: ${LAB_LEDGER_OPERATOR:local}
    max-pool-size: ${LAB_LEDGER_MAX_POOL_SIZE:4}
    min-idle: ${LAB_LEDGER_MIN_IDLE:1}
    connection-timeout-ms: ${LAB_LEDGER_CONNECTION_TIMEOUT_MS:3000}
    validation-timeout-ms: ${LAB_LEDGER_VALIDATION_TIMEOUT_MS:1000}
    # CREATE DATABASE / Flyway retry period while MySQL is unreachable.
    bootstrap-retry-seconds: ${LAB_LEDGER_BOOTSTRAP_RETRY_SECONDS:15}
    bootstrap-thread-name: ${LAB_LEDGER_BOOTSTRAP_THREAD_NAME:ledger-bootstrap}
    flyway-locations: ${LAB_LEDGER_FLYWAY_LOCATIONS:classpath:db/ledger}
    # File-backed write-behind buffer; the directory is a compose named volume.
    stash-dir: ${LAB_LEDGER_STASH_DIR:/app/ledger-stash}
    stash-max-files: ${LAB_LEDGER_STASH_MAX_FILES:500}
    stash-max-bytes: ${LAB_LEDGER_STASH_MAX_BYTES:262144}
    stash-replay-interval-seconds: ${LAB_LEDGER_STASH_REPLAY_INTERVAL_SECONDS:20}
    # Keep the newest N runs; children cascade.
    retention-runs: ${LAB_LEDGER_RETENTION_RUNS:50}
    retention-interval-minutes: ${LAB_LEDGER_RETENTION_INTERVAL_MINUTES:30}
    # Startup scan: RUNNING/STOPPING/VERIFYING -> UNKNOWN.
    recovery-enabled: ${LAB_LEDGER_RECOVERY_ENABLED:true}
    query-default-limit: ${LAB_LEDGER_QUERY_DEFAULT_LIMIT:50}
    query-max-limit: ${LAB_LEDGER_QUERY_MAX_LIMIT:200}
    max-payload-bytes: ${LAB_LEDGER_MAX_PAYLOAD_BYTES:65536}
    run-id-max-attempts: ${LAB_LEDGER_RUN_ID_MAX_ATTEMPTS:10}
    # B3-00a draft limits: enabled Java nodes and fault-timeline entries.
    max-nodes: ${LAB_LEDGER_MAX_NODES:3}
    max-fault-items: ${LAB_LEDGER_MAX_FAULT_ITEMS:16}
    # B1-02 operation contract: every environment-changing request writes one
    # lab_operation row and returns operationId. Work runs on this dedicated
    # daemon pool, never on the chaos TTL/revert scheduler. sync-wait-ms is the
    # budget after which the API answers 202 PENDING_CONFIRMATION (not a
    # failure) while the worker keeps going; keep it below the client timeout.
    operation:
      thread-name: ${LAB_LEDGER_OPERATION_THREAD_NAME:ledger-operation}
      pool-size: ${LAB_LEDGER_OPERATION_POOL_SIZE:2}
      sync-wait-ms: ${LAB_LEDGER_OPERATION_SYNC_WAIT_MS:3000}
    # Same Idempotency-Key + action + target inside this window replays the
    # original operationId without a second side effect; outside it the key is
    # released and may be reused.
    idempotency:
      window-seconds: ${LAB_LEDGER_IDEMPOTENCY_WINDOW_SECONDS:600}
    # One active write run: start takes this lock, stop releases it. The TTL is
    # the takeover escape hatch when a holder dies without releasing.
    env-lock:
      key: ${LAB_LEDGER_ENV_LOCK_KEY:env:write-run}
      ttl-seconds: ${LAB_LEDGER_ENV_LOCK_TTL_SECONDS:1800}
      # Retries when the lock row keeps changing between insert and read.
      acquire-attempts: ${LAB_LEDGER_ENV_LOCK_ACQUIRE_ATTEMPTS:3}
  # B3-00b run-scoped fault timeline: offsets are relative to the k6 launch;
  # the validator normalises manual holds and persists the canonical list.
  # Same defaults in compose.base.yml and .env.example.
  fault-schedule:
    max-offset-seconds: ${LAB_FAULT_SCHEDULE_MAX_OFFSET_SECONDS:3600}
    thread-name: ${LAB_FAULT_SCHEDULE_THREAD_NAME:fault-schedule}
    pool-size: ${LAB_FAULT_SCHEDULE_POOL_SIZE:2}

  # Stage2 B3-04 run-scoped business reconciliation: read-only aggregate SQL
  # against the business `seckill` schema (standalone mysql:3306; db-ha through
  # mysql-router:6446) plus a RabbitMQ management probe. A baseline snapshot is
  # captured after READY→RUNNING; POST /lab/runs/{runId}/reconcile compares
  # against it. Unwired/unreachable probes are DEGRADED, never 0. Passwords
  # never appear in a URL and are never logged.
  reconcile:
    enabled: ${LAB_RECONCILE_ENABLED:true}
    mysql-mode: ${LAB_RECONCILE_MYSQL_MODE:${MYSQL_MODE:standalone}}
    # Blank uses the mode-based URL below; set this to pin one business URL.
    business-url: "${LAB_RECONCILE_BUSINESS_URL:}"
    standalone-url: "${LAB_RECONCILE_STANDALONE_URL:jdbc:mysql://${MYSQL_HOST:mysql}:3306/seckill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    router-url: "${LAB_RECONCILE_ROUTER_URL:jdbc:mysql://${MYSQL_ROUTER_HOST:mysql-router}:6446/seckill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    schema: ${LAB_RECONCILE_SCHEMA:seckill}
    # Business account created by the stack's MySQL init; read-only queries only.
    user: ${LAB_RECONCILE_BUSINESS_USER:${MYSQL_USER:seckill}}
    password: "${LAB_RECONCILE_BUSINESS_PASSWORD:${MYSQL_PASSWORD:seckill}}"
    # Per-statement JDBC timeout and bounded sample size.
    query-timeout-seconds: ${LAB_RECONCILE_QUERY_TIMEOUT_SECONDS:5}
    max-sample-rows: ${LAB_RECONCILE_MAX_SAMPLE_ROWS:20}
    # Queue drain: total budget, per-request timeout and poll interval.
    mq-drain-timeout-seconds: ${LAB_RECONCILE_MQ_DRAIN_TIMEOUT_SECONDS:10}
    mq-request-timeout-seconds: ${LAB_RECONCILE_MQ_REQUEST_TIMEOUT_SECONDS:2}
    mq-poll-interval-millis: ${LAB_RECONCILE_MQ_POLL_INTERVAL_MILLIS:500}
    # RabbitMQ management API (compose-network address; port 15672 is also
    # published on 127.0.0.1 for operators). Credentials are lab-only.
    mq-management-url: ${LAB_RECONCILE_MQ_MANAGEMENT_URL:http://rabbitmq:15672}
    mq-vhost: "${LAB_RECONCILE_MQ_VHOST:/}"
    mq-queue: ${LAB_RECONCILE_MQ_QUEUE:seckill.order.queue}
    mq-user: ${LAB_RECONCILE_MQ_USER:${RABBITMQ_DEFAULT_USER:lab}}
    mq-password: "${LAB_RECONCILE_MQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:lab}}"

  # Stage2 B1-03 metrics aggregation: chaos-controller queries Prometheus
  # /api/v1/query_range only through the versioned catalog (no arbitrary PromQL
  # from the frontend). The run window is [runStart - scrape-grace,
  # runEnd + drain-grace]; every value below is mirrored in compose and
  # .env.example. A missing/failed Prometheus is DEGRADED, never a synthetic 0.
  metrics:
    prometheus-url: ${LAB_METRICS_PROMETHEUS_URL:http://prometheus:9090}
    connect-timeout-seconds: ${LAB_METRICS_CONNECT_TIMEOUT_SECONDS:2}
    request-timeout-seconds: ${LAB_METRICS_REQUEST_TIMEOUT_SECONDS:10}
    # Padding before the run start / after the run end (both externalized).
    scrape-grace-seconds: ${LAB_METRICS_SCRAPE_GRACE_SECONDS:15}
    drain-grace-seconds: ${LAB_METRICS_DRAIN_GRACE_SECONDS:30}
    # Per-series point cap (raised step), step floor and total series/key caps.
    max-points: ${LAB_METRICS_MAX_POINTS:300}
    min-step-seconds: ${LAB_METRICS_MIN_STEP_SECONDS:15}
    max-series: ${LAB_METRICS_MAX_SERIES:120}
    max-keys: ${LAB_METRICS_MAX_KEYS:40}
    # Deep links: the console renders these in the BROWSER, so grafana-url is the
    # host-facing address (localhost:3000 is published; grafana:3000 is not
    # resolvable from the operator's machine). A blank dashboard UID means the
    # Grafana link points at Explore (no panel UID is hard-coded). tempo-url is
    # the controller-side address; Tempo 3200 is NOT published on the host by
    # default, so open the Tempo link only after publishing that port.
    grafana-url: ${LAB_METRICS_GRAFANA_URL:http://localhost:3000}
    tempo-url: ${LAB_METRICS_TEMPO_URL:http://tempo:3200}
    grafana-dashboard-uid: ${LAB_METRICS_GRAFANA_DASHBOARD_UID:}
    catalog-location: ${LAB_METRICS_CATALOG_LOCATION:classpath:metrics/catalog.yml}

  # Stage2 B1-04 run pre-check: a read-only gate executed by
  # POST /lab/runs/{runId}/start BEFORE any transition and before the
  # write-run lock. Blocking items answer 409/40903 and keep the run DRAFT;
  # there is no force/skip parameter. `enabled=false` disables the whole gate
  # (ledger-only stacks), never a single blocking item.
  precheck:
    enabled: ${LAB_PRECHECK_ENABLED:true}
    # Background load container that must be stopped (compose `traffic`
    # profile). Separate from chaos.traffic.container-name on purpose.
    traffic-container: ${LAB_PRECHECK_TRAFFIC_CONTAINER:jl-traffic}
    # Application containers whose RUNNING image ids must agree.
    app-containers: ${LAB_PRECHECK_APP_CONTAINERS:jl-app-1,jl-app-2,jl-app-3}
    # Prometheus instant-query budget for the monitoring check.
    prometheus-timeout-seconds: ${LAB_PRECHECK_PROMETHEUS_TIMEOUT_SECONDS:5}
    # Healthy up{job="seckill-app"} target count.
    required-app-targets: ${LAB_PRECHECK_REQUIRED_APP_TARGETS:3}
    # Which monitoring series the gate insists on. The dev stack has the
    # single-node redis-exporter and the MySQL cluster probe; an ha-only render
    # turns the matching flag off and can add its own requirements through
    # extra-queries (semicolon separated name=promql; each entry must return a
    # non-empty instant result, so a threshold lives inside the PromQL, e.g.
    # redis-ha=sum(up{job="redis-exporter-ha"}) >= 1).
    require-redis-exporter: ${LAB_PRECHECK_REQUIRE_REDIS_EXPORTER:true}
    require-mysql-probe: ${LAB_PRECHECK_REQUIRE_MYSQL_PROBE:true}
    extra-queries: ${LAB_PRECHECK_EXTRA_QUERIES:}
    # Memory rule: sum(mem_limit of running lab containers) + reserve must fit
    # inside Docker Info.MemTotal, otherwise the start is blocked.
    memory-reserve-mb: ${LAB_PRECHECK_MEMORY_RESERVE_MB:1024}
    # Optional expected app image id (full id or a unique prefix). Blank = only
    # check that the running instances agree.
    expected-app-image-id: ${LAB_PRECHECK_EXPECTED_APP_IMAGE_ID:}
    # Cap for blocking[] / warnings[] / passed[]; items[] stays complete.
    max-listed-items: ${LAB_PRECHECK_MAX_LISTED_ITEMS:10}
    # Wall-clock budget of one report; a check that cannot start in it is
    # reported BLOCK (fail closed).
    check-timeout-seconds: ${LAB_PRECHECK_CHECK_TIMEOUT_SECONDS:30}

  # Stage2 B2-01b: read-only bench scenario catalog (GET /lab/bench/scenarios).
  # The controller image does not COPY code/lab/**, so compose mounts
  # code/lab/k6 at /app/k6 read-only and this default is a file: location; a
  # classpath: copy is also accepted. A missing/unreadable/inconsistent manifest
  # answers 503/50303 - never an empty catalog that pretends to be OK.
  bench:
    scenarios-location: ${LAB_BENCH_SCENARIOS_LOCATION:file:/app/k6/scenarios/manifest.json}
    # Stage2 B2-02a/B2-02b-1: controlled k6 executor. All keys are externalized.
    # scripts-host-dir stays blank by default; BenchScriptsHostDirResolver
    # (B2-02b-1) discovers the host path behind /app/k6, while the planner still
    # refuses a blank value (503/50303) instead of mounting "".
    exec:
      k6-image: ${LAB_BENCH_EXEC_K6_IMAGE:grafana/k6:1.3.0}
      network: ${LAB_BENCH_EXEC_NETWORK:jl-net}
      scripts-host-dir: ${LAB_BENCH_EXEC_SCRIPTS_HOST_DIR:}
      scripts-mount: ${LAB_BENCH_EXEC_SCRIPTS_MOUNT:/scripts}
      reports-mount: ${LAB_BENCH_EXEC_REPORTS_MOUNT:/reports}
      reports-volume: ${LAB_BENCH_EXEC_REPORTS_VOLUME:jl-k6-reports}
      prometheus-rw-url: ${LAB_BENCH_EXEC_PROMETHEUS_RW_URL:http://prometheus:9090/api/v1/write}
      # Stage2 B2-03a: via-nginx BASE_URL. The old LAB_BENCH_EXEC_BASE_URL
      # key is retired; this key carries the same default.
      nginx-base-url: ${LAB_BENCH_EXEC_NGINX_BASE_URL:http://nginx}
      # Fixed service-name table for target-instance runs (never a URL/host/
      # port request field) and the port the planner appends to it.
      target-instances: ${LAB_BENCH_EXEC_TARGET_INSTANCES:app-1,app-2,app-3}
      target-port: ${LAB_BENCH_EXEC_TARGET_PORT:8080}
      container-prefix: ${LAB_BENCH_EXEC_CONTAINER_PREFIX:jl-k6-}
      max-vus: ${LAB_BENCH_EXEC_MAX_VUS:1000}
      max-duration-seconds: ${LAB_BENCH_EXEC_MAX_DURATION_SECONDS:3600}
      summary-file: ${LAB_BENCH_EXEC_SUMMARY_FILE:summary.json}
      # Stage2 B2-02b-1: host scripts directory resolution + bounded reads.
      # The resolver maps controller-k6-mount to the Mount.Source of the
      # controller container named below; scripts-host-dir (when set) wins.
      # Every cap/timeout is externalized with the same default in
      # compose.base.yml and .env.example.
      controller-container: ${LAB_BENCH_EXEC_CONTROLLER_CONTAINER:jl-chaos-controller}
      controller-k6-mount: ${LAB_BENCH_EXEC_CONTROLLER_K6_MOUNT:/app/k6}
      report-max-bytes: ${LAB_BENCH_EXEC_REPORT_MAX_BYTES:4194304}
      logs-max-bytes: ${LAB_BENCH_EXEC_LOGS_MAX_BYTES:65536}
      logs-max-tail: ${LAB_BENCH_EXEC_LOGS_MAX_TAIL:1000}
      stop-grace-seconds: ${LAB_BENCH_EXEC_STOP_GRACE_SECONDS:10}
      # Stage2 B2-02b-2a: exit/timeout watchdog and startup orphan cleanup.
      # The watchdog settles EXITED runs and fails overrun runs; the first
      # tick after ledger readiness removes lab.role=k6 containers whose run
      # is missing or no longer RUNNING. Same defaults in compose/.env.example.
      watchdog-enabled: ${LAB_BENCH_EXEC_WATCHDOG_ENABLED:true}
      watchdog-interval-seconds: ${LAB_BENCH_EXEC_WATCHDOG_INTERVAL_SECONDS:5}
      timeout-grace-seconds: ${LAB_BENCH_EXEC_TIMEOUT_GRACE_SECONDS:30}
      stopping-settle-grace-seconds: ${LAB_BENCH_EXEC_STOPPING_SETTLE_GRACE_SECONDS:30}
      orphan-cleanup-enabled: ${LAB_BENCH_EXEC_ORPHAN_CLEANUP_ENABLED:true}

# Chaos actions (Task 21). Every TTL/timeout/URL/credential is externalized;
# compose passes the same keys with the same defaults.
chaos:
  # TTL used when kill/freeze omits ttlSeconds.
  default-ttl-seconds: ${CHAOS_DEFAULT_TTL_SECONDS:120}
  # Upper bound accepted from callers.
  max-ttl-seconds: ${CHAOS_MAX_TTL_SECONDS:600}
  # Deadline for the post-start/post-resume readiness probe (async, non-blocking).
  action-timeout-seconds: ${CHAOS_ACTION_TIMEOUT_SECONDS:30}
  # Watchdog sweep interval: second safety net for lost TTL reverts.
  watchdog-interval-seconds: ${CHAOS_WATCHDOG_INTERVAL_SECONDS:5}
  # Docker stop grace period (manual stop so unless-stopped does not restart).
  stop-grace-seconds: ${CHAOS_STOP_GRACE_SECONDS:10}
  # Revert retries before an action stays FAILED until stop-all.
  max-revert-attempts: ${CHAOS_MAX_REVERT_ATTEMPTS:3}
  # Core threads of the scheduler that runs TTL reverts, the watchdog and the
  # readiness probes; raise it if many probes could starve TTL reverts.
  scheduler-threads: ${CHAOS_SCHEDULER_THREADS:4}
  # manual (lab default): keep injected faults after the guide finishes so the
  # operator can read logs/traces; auto: revert everything at the terminal state.
  reset-mode: ${LAB_RESET_MODE:manual}
  # Interactive guide (Task 22b). Scenarios are shared with k6 (schema v1).
  guide:
    # Read-only scenario directory; compose mounts code/lab/scenarios here.
    scenario-dir: ${CHAOS_GUIDE_SCENARIO_DIR:/app/scenarios}
    # Only application instances may be targeted by default; a datastore-named
    # container additionally needs the allow-list below.
    target-pattern: "${CHAOS_GUIDE_TARGET_PATTERN:^jl-app-[0-9]+$}"
  # Datastore fault targets (M3-1c): CLOSED BY DEFAULT. Empty = every container
  # whose name contains mysql|redis|rabbit|mongo|postgres is refused with 403,
  # exactly like the previous absolute prohibition. The HA Sentinel drill sets it
  # to the three Redis data nodes only, e.g.
  # CHAOS_DATASTORE_ALLOWED_TARGET_PATTERN='^jl-redis-[0-9]+$' (never jl-redis,
  # jl-mysql, jl-rabbitmq, jl-redis-*-exporter or the observability stack).
  # Teaching-lab safety valve, not a production affordance; the regex is
  # compiled at startup so an invalid value fails the context.
  datastore:
    allowed-target-pattern: "${CHAOS_DATASTORE_ALLOWED_TARGET_PATTERN:}"
  # Background traffic (Task 23): the compose "traffic" profile container.
  traffic:
    container-name: ${CHAOS_TRAFFIC_CONTAINER:jl-traffic}
    stop-grace-seconds: ${CHAOS_TRAFFIC_STOP_GRACE_SECONDS:5}
  annotation:
    # Best-effort Grafana annotations; failures are logged, never fatal.
    enabled: ${CHAOS_ANNOTATION_ENABLED:true}
    grafana-url: ${CHAOS_ANNOTATION_GRAFANA_URL:http://grafana:3000}
    user: ${GRAFANA_ADMIN_USER:}
    password: ${GRAFANA_ADMIN_PASSWORD:}
    timeout-seconds: ${CHAOS_ANNOTATION_TIMEOUT_SECONDS:3}
    # Optional extra comma-separated tags; mandatory tags are added in code.
    tags: ${CHAOS_ANNOTATION_TAGS:}
  # Toxiproxy network faults (design §11.3). The proxies themselves live in the
  # chaos-proxy compose overlay; this controller only talks to the control API.
  # Applications must be restarted with the proxy wiring (design §3.3), so these
  # faults belong to the demo preparation phase.
  toxiproxy:
    # Enabled by default so the capability is present when the overlay is up.
    # Without the chaos-proxy profile the endpoints answer 503/50301 and
    # stop-all reports a failed network cleanup; set false on stacks that never
    # run that profile.
    enabled: ${CHAOS_TOXIPROXY_ENABLED:true}
    url: ${CHAOS_TOXIPROXY_URL:http://toxiproxy:8474}
    connect-timeout-seconds: ${CHAOS_TOXIPROXY_CONNECT_TIMEOUT_SECONDS:2}
    request-timeout-seconds: ${CHAOS_TOXIPROXY_REQUEST_TIMEOUT_SECONDS:5}
    # Allow-list of control-plane proxy names; anything else is a 404.
    proxies: ${CHAOS_TOXIPROXY_PROXIES:redis,mysql}
    # Request bounds; defaults are used when a toxic request omits a parameter.
    default-latency-ms: ${CHAOS_TOXIPROXY_DEFAULT_LATENCY_MS:500}
    max-latency-ms: ${CHAOS_TOXIPROXY_MAX_LATENCY_MS:30000}
    default-jitter-ms: ${CHAOS_TOXIPROXY_DEFAULT_JITTER_MS:50}
    max-jitter-ms: ${CHAOS_TOXIPROXY_MAX_JITTER_MS:5000}
    default-bandwidth-kbps: ${CHAOS_TOXIPROXY_DEFAULT_BANDWIDTH_KBPS:100}
    max-bandwidth-kbps: ${CHAOS_TOXIPROXY_MAX_BANDWIDTH_KBPS:10240}
    default-timeout-ms: ${CHAOS_TOXIPROXY_DEFAULT_TIMEOUT_MS:1000}
    max-timeout-ms: ${CHAOS_TOXIPROXY_MAX_TIMEOUT_MS:60000}
  # Narrow proxy to the app tier's /lab/thread/** and /lab/cache/** APIs (thread
  # and cache consoles). Nginx deliberately does not proxy app /lab/** paths, so
  # the console reaches both labs only through this controller hop. The instance
  # allow-list and the two explicit path allow-lists in AppProxyService are the
  # security boundary; GET and POST are the only forwarded methods, and only
  # POST /lab/thread/fault and POST /lab/cache/mode carry a body. The raw query
  # string is relayed verbatim (allow-list matching never sees it), so app GET
  # endpoints can be paginated via ?cursor=... without another proxy change.
  app-proxy:
    instances: ${CHAOS_APP_PROXY_INSTANCES:app-1,app-2,app-3}
    scheme: ${CHAOS_APP_PROXY_SCHEME:http}
    port: ${CHAOS_APP_PROXY_PORT:8080}
    connect-timeout-seconds: ${CHAOS_APP_PROXY_CONNECT_TIMEOUT_SECONDS:2}
    # Seed runs synchronously in the app; keep this above the worst-case 1000-row
    # seed. Override in .env if the lab host seeds slower.
    request-timeout-seconds: ${CHAOS_APP_PROXY_REQUEST_TIMEOUT_SECONDS:30}
    # Request body cap: oversized console bodies are refused 413/41301 before
    # reaching the app (the fault/mode JSON envelopes are tiny by design).
    max-request-bytes: ${CHAOS_APP_PROXY_MAX_REQUEST_BYTES:8192}
    # Response body cap: an upstream answer larger than this is refused
    # 502/50202, never truncated (truncation would break the Result envelope).
    # Raise via env when B3 key-list pages need a wider relay.
    max-response-bytes: ${CHAOS_APP_PROXY_MAX_RESPONSE_BYTES:2097152}
  # MySQL InnoDB Cluster membership metrics for panel D11 (design §8.3).
  # Read-only: one SELECT every interval through `docker exec` into one node.
  # Enabled by default so the db-ha stack exposes the metrics without extra
  # wiring; a missing container only sets mysql_cluster_probe_up=0 (one WARN).
  # No credential is configured here: the default command expands MYSQL_PWD
  # inside the node from the container's own env (name in password-env-var).
  mysql-cluster:
    enabled: ${CHAOS_MYSQL_CLUSTER_ENABLED:true}
    interval-seconds: ${CHAOS_MYSQL_CLUSTER_INTERVAL_SECONDS:10}
    # Probe one node that is not the demo's kill target. A stopped probe
    # container looks like a broken probe, not like a degraded cluster.
    # B0-08 slice B: this value is also the isolation rule - a
    # kill/freeze/restart whose target equals it is refused with 403/40302
    # (ProbeTargetGuard), because faulting it would blind the drill mid-failover.
    container: ${CHAOS_MYSQL_CLUSTER_CONTAINER:jl-mysql-1}
    admin-user: ${CHAOS_MYSQL_CLUSTER_ADMIN_USER:root}
    password-env-var: ${CHAOS_MYSQL_CLUSTER_PASSWORD_ENV_VAR:MYSQL_ROOT_PASSWORD}
    query: >-
      SELECT MEMBER_HOST, MEMBER_PORT, MEMBER_STATE, MEMBER_ROLE
      FROM performance_schema.replication_group_members
      ORDER BY MEMBER_ROLE DESC, MEMBER_HOST
    # argv, not a shell string from the JVM: password and SQL are expanded by
    # bash from the container's environment. The SQL must NOT travel on stdin:
    # docker-java 3.7.1 never gives the container an EOF on an attached stdin,
    # so `mysql` would block until the exec timeout (observed live, step-31).
    command:
      - /bin/bash
      - -c
      - >-
        MYSQL_PWD="${!MYSQL_CLUSTER_PASSWORD_ENV}" exec mysql
        --batch --raw --skip-column-names -h127.0.0.1 -u"$MYSQL_CLUSTER_ADMIN_USER"
        -e "$MYSQL_CLUSTER_QUERY"
    exec-timeout-seconds: ${CHAOS_MYSQL_CLUSTER_EXEC_TIMEOUT_SECONDS:6}
    expected-member-count: ${CHAOS_MYSQL_CLUSTER_EXPECTED_MEMBER_COUNT:3}
    thread-name: ${CHAOS_MYSQL_CLUSTER_THREAD_NAME:mysql-cluster-probe}
    shutdown-timeout-seconds: ${CHAOS_MYSQL_CLUSTER_SHUTDOWN_TIMEOUT_SECONDS:5}
    # B0-08 slice B: on a failed probe, inspect the probe container once to tell
    # "the node is up but MySQL answered wrongly" from "the probe container itself
    # was killed" (观测自损: every mysql_cluster_* series then freezes). One extra
    # inspect per failed tick; disable on stacks where even that is too chatty.
    failure-container-check-enabled: ${CHAOS_MYSQL_CLUSTER_FAILURE_CONTAINER_CHECK_ENABLED:true}
