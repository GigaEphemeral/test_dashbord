# Documentation claim registry.
#
# Each entry is a falsifiable statement copied from (or implied by) the docs.
# `verify` inspects the repository; it never talks to Docker, Maven or the
# network. Run it with:
#
#   node code/lab/scripts/check-doc-claims.mjs
#
# Semantics
# ---------
# positive (default): the statement says the capability exists. If `verify`
#                     does not match `expect`, the claim FAILs.
# negative:           the statement says the capability is missing. If `verify`
#                     now matches `expect` (for example ha-d8.json appeared),
#                     the claim is STALE and the docs must be updated.
#
# `expect` is the observed value that would agree with the statement:
#   - file_exists / file_contains / shell: true or false
#   - grep_count: a number. 0 means "no matching line"; N > 0 means
#     "at least N matching lines".
# A negative claim therefore uses `expect: false` (or `expect: 0`).
#
# `path` values are relative to the repository root. `pattern` is a JavaScript
# regular expression. `shell` commands must be fast and read-only.

# ---------------------------------------------------------------------------
# Positive claims: the capability exists in code, so the docs must not call it
# missing. These are the exact features that drifted in 2026-10.
# ---------------------------------------------------------------------------

