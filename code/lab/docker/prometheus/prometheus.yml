# Prometheus 3.x configuration for the local HA lab.
# Targets are compose-network service names; only Grafana is published on the host.

global:
  scrape_interval: 5s
  scrape_timeout: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The three JDK 21 app instances expose Micrometer/Actuator metrics directly.
  - job_name: seckill-app
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["app-1:8080", "app-2:8080", "app-3:8080"]
    metric_relabel_configs:
      # The Prometheus Java client rejects OpenMetrics-reserved suffixes such as
      # _created in meter names. Micrometer's orders_created_total counter is
      # therefore scraped as orders_total; alias it back at scrape time so D4
      # dashboards can use the documented business metric name.
      - source_labels: [__name__]
        regex: orders_total
        target_label: __name__
        replacement: orders_created_total

  # D7 dual-JDK comparison: the Java 8 shell (compose profile "dual-jdk").
  # The job name is load-bearing twice over: it matches the seckill-app.* regex
  # behind D1/D2/D4's $instance variable (so the instance also appears in those
  # JVM panels), and D7 filters on this exact job + the app label. With the
  # profile stopped the target is simply down, like the db-ha exporters.
  - job_name: seckill-app-jdk8
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["seckill-app-jdk8:8080"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Per-queue metrics (Task 18). The default plugin endpoint aggregates every
  # queue and carries no queue label, so D4's backlog panels bind to the
  # detailed endpoint and alias rabbitmq_detailed_queue_* back to the documented
  # rabbitmq_queue_* family. The aggregate job above is kept for cluster-wide
  # counters such as rabbitmq_queue_messages_delivered_total.
  - job_name: rabbitmq-queue
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    scrape_interval: 5s
    static_configs:
      - targets: ["rabbitmq:15692"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: rabbitmq_detailed_(queue_.*)
        target_label: __name__
        replacement: rabbitmq_$1

  # cAdvisor serves a large payload and is slow on the first scrape in Docker
  # Desktop/WSL2, so it gets a longer interval/timeout than the global 5s default.
  - job_name: cadvisor
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # Lab controller: token-protected container list + logs (no host port).
  - job_name: chaos-controller
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["chaos-controller:8081"]

  # db-ha tier: one job, three labelled targets so D11 can group by member.
  # Targets are down (not an error) whenever the db-ha profile is off.
  - job_name: mysqld-exporter-ha
    static_configs:
      - targets: ["mysql-1-exporter:9104"]
        labels:
          member: mysql-1
      - targets: ["mysql-2-exporter:9104"]
        labels:
          member: mysql-2
      - targets: ["mysql-3-exporter:9104"]
        labels:
          member: mysql-3

  # ha tier (Redis): one exporter per Sentinel data node, mirroring the
  # mysqld-exporter-ha job above. Each exporter is addressed by its fixed compose
  # service name on jl-net plus redis_exporter's built-in 9121 (compose.ha.yml only
  # `expose`s it, publishes no host port), so there is nothing operational to
  # parameterise: exactly like the db-ha job the targets stay literal (Prometheus v3
  # does not interpolate ${VAR} in this file). The `node` label (redis-1/2/3) is a
  # low-cardinality per-node identity in the same class as `instance`, aligned with
  # the standalone `redis-exporter` job's口径; because this is its OWN job the
  # existing panels that bind `job="redis-exporter"` (D3 memory, D11 up/clients/
  # slaves, all documented as dev-single) keep matching only the single dev node and
  # never fan out to four targets. With the ha profile off the three targets simply
  # report down (not an error), same as the db-ha exporters.
  # Sentinel itself is intentionally NOT scraped: compose.ha.yml:309-312 ships no
  # sentinel-exporter sidecar on purpose and Sentinel speaks RESP, not an HTTP
  # /metrics endpoint. Master/replica evidence therefore comes from the data-node
  # exporters themselves (redis_instance_info{role=…}, redis_connected_slaves,
  # redis_master_link_up); the Sentinel quorum view stays on sentinel-status.sh.
  # See step-S2-B0-07-ha-exporters-scrape.md for the wiring rationale.
  - job_name: redis-exporter-ha
    static_configs:
      - targets: ["redis-1-exporter:9121"]
        labels:
          node: redis-1
      - targets: ["redis-2-exporter:9121"]
        labels:
          node: redis-2
      - targets: ["redis-3-exporter:9121"]
        labels:
          node: redis-3
