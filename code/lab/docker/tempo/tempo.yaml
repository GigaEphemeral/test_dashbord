# Tempo single-binary configuration for the local HA lab.
# Traces are stored locally under /var/tempo (named volume jl-tempo-data).
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

# The metrics generator produces service-graph and span metrics from incoming
# traces and remote-writes them to Prometheus (remote-write receiver enabled).
# Data appears only after the first traces arrive (Task 10 onward).
metrics_generator:
  registry:
    external_labels: {}
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      wait: 10s
    span_metrics: {}
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Tempo 2.6 accepts the current overrides format: defaults.metrics_generator.processors.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
