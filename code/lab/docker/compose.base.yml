# Shared infrastructure for the Java HA lab.
# Dev-only host exposure lives in compose.dev.yml. Add HA overlays in later milestones.

name: java-learn-lab

# Shared application-tier defaults. Host ports are intentionally absent: the
# only public entry point is Nginx on 127.0.0.1:8080.
x-app-common: &app-common
  image: java-learn-lab/seckill-app:jdk21
  build:
    context: ../..
    dockerfile: services/seckill-app-jdk21/Dockerfile
    args:
      OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION:-2.10.0}
  restart: unless-stopped
  mem_limit: 768m
  networks:
    - jl-net
  labels:
    lab: "java-learn"
    lab.role: "app"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    otel-collector:
      condition: service_started
  healthcheck:
    # The app group is the container gate: every health contributor except
    # Redis (product cache L2 is best-effort; with Redis down, reads degrade
    # to MySQL and the instance must stay healthy for the §8.2 failover
    # demos). Root /actuator/health still reports Redis honestly.
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/app | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s

x-app-env: &app-env
  TZ: ${TZ}
  # Catalog datasource (lab-only credentials; never logged by the app or scripts).
  MYSQL_HOST: mysql
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  # Product cache L2 (Task 14). Redis remains best-effort: failures fall back
  # to MySQL reads and are counted as cache_l2_errors.
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Async seckill order queue (Task 16). The app consumes/ publishes with the
  # same lab broker credentials; values are interpolated, never duplicated.
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
  OTEL_SERVICE_NAME: seckill-app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  # Metrics stay on the Actuator scrape path; logs stay on stdout (JSON).
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev

services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: jl-nginx
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Static Vue console built by up.sh; dist is gitignored.
      - ../dashboard/dist:/usr/share/nginx/html/lab:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "nginx"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
      chaos-controller:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: jl-mysql
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - jl-mysql-data:/var/lib/mysql
      - ./mysql/init/00-exporter.sql:/docker-entrypoint-initdb.d/00-exporter.sql:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "mysql"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    container_name: jl-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: ${TZ}
    volumes:
      - jl-redis-data:/data
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "redis"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: jl-rabbitmq
    hostname: jl-rabbitmq
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - jl-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # --- Application tier (Task 10): three identical instances, Nginx entry only ---

  app-1:
    <<: *app-common
    container_name: jl-app-1
    environment:
      <<: *app-env
      INSTANCE_ID: app-1

  app-2:
    <<: *app-common
    container_name: jl-app-2
    environment:
      <<: *app-env
      INSTANCE_ID: app-2

  app-3:
    <<: *app-common
    container_name: jl-app-3
    environment:
      <<: *app-env
      INSTANCE_ID: app-3

  # --- Lab controller (Task 11): token-protected container list + log tail ---

  chaos-controller:
    image: java-learn-lab/chaos-controller:jdk21
    build:
      context: ../..
      dockerfile: services/chaos-controller/Dockerfile
    container_name: jl-chaos-controller
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      LAB_TOKEN: ${LAB_TOKEN:-lab-token}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Read-write socket is required for later fault actions. Lab-only: the
      # token filter and the lab=java-learn whitelist are enforced in Java.
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8081"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "chaos"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE}
    container_name: jl-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE}
    container_name: jl-mysqld-exporter
    restart: unless-stopped
    mem_limit: 64m
    # v0.15+ removed DATA_SOURCE_NAME; use the supported flags and password env.
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      TZ: ${TZ}
      # Lab-only exporter account (see .env.example). The database-side password is
      # fixed in mysql/init/00-exporter.sql, so changing MYSQLD_EXPORTER_PASSWORD
      # also requires updating that SQL file (and recreating the MySQL volume).
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD}
    expose:
      - "9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  nginx-exporter:
    image: ${NGINX_EXPORTER_IMAGE}
    container_name: jl-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    command: ["-nginx.scrape-uri=http://nginx:80/stub_status"]
    environment:
      TZ: ${TZ}
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  # --- Observability stack (internal only; Grafana is the sole host port) ---

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: jl-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      # The console reaches the UI through Nginx at /prom/. Keep internal
      # routes at / (so scrapes and Grafana keep using http://prometheus:9090)
      # while generated UI links carry the /prom/ prefix.
      - --web.external-url=http://127.0.0.1:8080/prom/
      - --web.route-prefix=/
    environment:
      TZ: ${TZ}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jl-prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: jl-grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # Only Grafana is published on the host, bound to loopback.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - jl-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "grafana"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  tempo:
    image: ${TEMPO_IMAGE}
    container_name: jl-tempo
    restart: unless-stopped
    mem_limit: 384m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      TZ: ${TZ}
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - jl-tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "9095"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "tempo"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready | grep -q ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: jl-otel-collector
    restart: unless-stopped
    mem_limit: 128m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      TZ: ${TZ}
    volumes:
      - ./otel-collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"
    depends_on:
      tempo:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "otel-collector"
    # The official collector image is distroless (no shell/wget), so it cannot
    # run an in-container healthcheck. verify.sh probes / on 13133 over jl-net.

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: jl-cadvisor
    restart: unless-stopped
    mem_limit: 128m
    # Lab-only: required by cAdvisor to read cgroups/host mounts.
    privileged: true
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=lab,lab.role
    environment:
      TZ: ${TZ}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "cadvisor"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  jl-mysql-data:
    name: jl-mysql-data
  jl-redis-data:
    name: jl-redis-data
  jl-rabbitmq-data:
    name: jl-rabbitmq-data
  jl-prometheus-data:
    name: jl-prometheus-data
  jl-grafana-data:
    name: jl-grafana-data
  jl-tempo-data:
    name: jl-tempo-data

networks:
  jl-net:
    name: jl-net
    driver: bridge
