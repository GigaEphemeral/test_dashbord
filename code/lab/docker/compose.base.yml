# Shared infrastructure for the Java HA lab.
# Dev-only host exposure lives in compose.dev.yml. Add HA overlays in later milestones.

name: java-learn-lab

# Shared application-tier defaults. Host ports are intentionally absent: the
# only public entry point is Nginx on 127.0.0.1:8080.
x-app-common: &app-common
  image: java-learn-lab/seckill-app:jdk21
  build:
    context: ../..
    dockerfile: services/seckill-app-jdk21/Dockerfile
    args:
      OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION:-2.10.0}
  restart: unless-stopped
  mem_limit: 768m
  # Thread-lab snapshots (design §9.3) land on the host so a capture can be
  # read/inspected without `docker cp`; the app user (uid 100) writes into the
  # bind mount. The path is three levels up from code/lab/docker/ (repo root).
  volumes:
    - ../../../doc/process/Stage1/snapshots:/app/lab-snapshots
  networks:
    - jl-net
  labels:
    lab: "java-learn"
    lab.role: "app"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    otel-collector:
      condition: service_started
  healthcheck:
    # The app group is the container gate: every health contributor except
    # Redis (product cache L2 is best-effort; with Redis down, reads degrade
    # to MySQL and the instance must stay healthy for the §8.2 failover
    # demos). Root /actuator/health still reports Redis honestly.
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/app | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s

x-app-env: &app-env
  TZ: ${TZ}
  # D7 (design 10.2): the JDK 21 instances here and the JDK 8 service below pin
  # the same heap cap through JAVA_TOOL_OPTIONS, so throughput/P99/GC are
  # compared under an equal -Xmx. Xmx overrides the Dockerfile's
  # MaxRAMPercentage (which stays for standalone runs of the image); override
  # without a rebuild to re-run a tuning sample.
  JAVA_TOOL_OPTIONS: "${APP_JAVA_TOOL_OPTIONS:--Xmx512m}"
  # Catalog datasource (lab-only credentials; never logged by the app or scripts).
  MYSQL_HOST: mysql
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  # MySQL access mode (design §3.3/§8.3). standalone (default) keeps BOTH pools
  # on the dev single-node `mysql` above, byte-identical to before the switch.
  # router sends the write pool to DB_WRITE_URL (MySQL Router 6446, read-write,
  # follows the primary) and the read pool to DB_READ_URL (Router 6447,
  # read-only, secondaries). The two URLs are empty by default and REQUIRED in
  # router mode: the app then fails startup instead of silently using the dev
  # MySQL. Set all three in .env after db-ha-up.sh; no image rebuild is needed.
  MYSQL_MODE: ${MYSQL_MODE:-standalone}
  DB_WRITE_URL: ${DB_WRITE_URL:-}
  DB_READ_URL: ${DB_READ_URL:-}
  # Product cache L2 (Task 14). Redis remains best-effort: failures fall back
  # to MySQL reads and are counted as cache_l2_errors.
  REDIS_HOST: redis
  REDIS_PORT: "${REDIS_PORT:-6379}"
  # Async seckill order queue (Task 16). The app consumes/ publishes with the
  # same lab broker credentials; values are interpolated, never duplicated.
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
  # Internal lab API (Task 17). Same shared secret as the chaos-controller;
  # Nginx does not proxy /lab/**, so only in-network callers can use it.
  LAB_TOKEN: ${LAB_TOKEN:-lab-token}
  # Per-instance runtime experiment toggles (Task 17). Runtime POST /lab/toggles
  # overrides these seeds; the chaos-controller will broadcast later.
  LAB_TOGGLE_LOCK: ${LAB_TOGGLE_LOCK:-true}
  LAB_TOGGLE_IDEMPOTENCY: ${LAB_TOGGLE_IDEMPOTENCY:-true}
  LAB_TOGGLE_MQ: ${LAB_TOGGLE_MQ:-true}
  LAB_TOGGLE_RATELIMIT: ${LAB_TOGGLE_RATELIMIT:-true}
  LAB_TOGGLE_CIRCUITBREAKER: ${LAB_TOGGLE_CIRCUITBREAKER:-true}
  LAB_TOGGLE_CACHE: ${LAB_TOGGLE_CACHE:-true}
  # Thread-lab snapshot bundle (design §9.3). The directory is the mount above;
  # the Grafana annotation is best-effort and uses the same admin credentials
  # the chaos-controller already receives (never logged by the app).
  LAB_THREAD_SNAPSHOT_DIR: /app/lab-snapshots
  LAB_THREAD_SNAPSHOT_MAX_COUNT: ${LAB_THREAD_SNAPSHOT_MAX_COUNT:-20}
  LAB_THREAD_SNAPSHOT_MAX_AGE_SECONDS: ${LAB_THREAD_SNAPSHOT_MAX_AGE_SECONDS:-604800}
  LAB_THREAD_SNAPSHOT_GRAFANA_URL: ${LAB_THREAD_SNAPSHOT_GRAFANA_URL:-http://grafana:3000}
  GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
  GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
  # D4 order-accept SLO buckets (Task 18). Micrometer parses the comma-separated
  # duration list; externalizing it keeps the histogram configuration out of code.
  ORDER_ACCEPT_SLO: ${ORDER_ACCEPT_SLO:-50ms,100ms,300ms,500ms,1s,2s}
  # Cache family (Stage2 B0-04). These LAB_CACHE_* keys are the compose-side
  # wiring of app.lab.cache.*; every default declared here
  # is the SAME value application.yml declares, so an absent .env entry keeps the
  # historical behaviour byte-for-byte. The effective value of each key — plus
  # its declared default and the property source that won — is readable at
  # runtime through GET /lab/config (cacheConfig), which is what makes a
  # "changed the TTL but nothing happened" drill answerable.
  #   L2 (TwoLevelCache's Redis write side; the values that used to be Java
  #   constants): write TTL, key layout prefix, clear() SCAN COUNT hint.
  LAB_CACHE_L2_TTL_SECONDS: ${LAB_CACHE_L2_TTL_SECONDS:-300}
  LAB_CACHE_L2_KEY_PREFIX: ${LAB_CACHE_L2_KEY_PREFIX:-cache:}
  LAB_CACHE_L2_CLEAR_SCAN_COUNT: ${LAB_CACHE_L2_CLEAR_SCAN_COUNT:-500}
  #   Defense-mode seed and the penetration/breakdown parameters.
  LAB_CACHE_DEFENSE_MODE: ${LAB_CACHE_DEFENSE_MODE:-off}
  LAB_CACHE_NULL_KEY_PREFIX: ${LAB_CACHE_NULL_KEY_PREFIX:-null:product:}
  LAB_CACHE_NULL_TTL_SECONDS: ${LAB_CACHE_NULL_TTL_SECONDS:-10}
  LAB_CACHE_NULL_JITTER_SECONDS: ${LAB_CACHE_NULL_JITTER_SECONDS:-5}
  LAB_CACHE_BLOOM_KEY: ${LAB_CACHE_BLOOM_KEY:-bloom:product-ids}
  LAB_CACHE_BLOOM_EXPECTED_INSERTIONS: ${LAB_CACHE_BLOOM_EXPECTED_INSERTIONS:-10000}
  LAB_CACHE_BLOOM_FALSE_PROBABILITY: ${LAB_CACHE_BLOOM_FALSE_PROBABILITY:-0.01}
  LAB_CACHE_MUTEX_KEY_PREFIX: ${LAB_CACHE_MUTEX_KEY_PREFIX:-lock:product:}
  LAB_CACHE_MUTEX_WAIT_MS: ${LAB_CACHE_MUTEX_WAIT_MS:-200}
  LAB_CACHE_MUTEX_LEASE_MS: ${LAB_CACHE_MUTEX_LEASE_MS:-2000}
  LAB_CACHE_MUTEX_ON_LOCK_TIMEOUT: ${LAB_CACHE_MUTEX_ON_LOCK_TIMEOUT:-db}
  LAB_CACHE_LOGICAL_TTL_SECONDS: ${LAB_CACHE_LOGICAL_TTL_SECONDS:-30}
  LAB_CACHE_LOGICAL_RETENTION_SECONDS: ${LAB_CACHE_LOGICAL_RETENTION_SECONDS:-600}
  LAB_CACHE_LOGICAL_MAX_ENTRIES: ${LAB_CACHE_LOGICAL_MAX_ENTRIES:-10000}
  LAB_CACHE_LOGICAL_REFRESH_POOL_SIZE: ${LAB_CACHE_LOGICAL_REFRESH_POOL_SIZE:-2}
  LAB_CACHE_LOGICAL_REFRESH_QUEUE_CAPACITY: ${LAB_CACHE_LOGICAL_REFRESH_QUEUE_CAPACITY:-100}
  LAB_CACHE_LOGICAL_REFRESH_KEEP_ALIVE_SECONDS: ${LAB_CACHE_LOGICAL_REFRESH_KEEP_ALIVE_SECONDS:-60}
  LAB_CACHE_LOGICAL_REFRESH_THREAD_PREFIX: ${LAB_CACHE_LOGICAL_REFRESH_THREAD_PREFIX:-breakdown-refresh}
  #   Avalanche parameters (ttl-jitter / l1-cache / db-fallback).
  LAB_CACHE_TTL_JITTER_PERCENT: ${LAB_CACHE_TTL_JITTER_PERCENT:-20}
  LAB_CACHE_L1_REFRESH_INTERVAL_SECONDS: ${LAB_CACHE_L1_REFRESH_INTERVAL_SECONDS:-10}
  LAB_CACHE_L1_STALE_WINDOW_SECONDS: ${LAB_CACHE_L1_STALE_WINDOW_SECONDS:-60}
  LAB_CACHE_L1_MAX_ENTRIES: ${LAB_CACHE_L1_MAX_ENTRIES:-10000}
  LAB_CACHE_L1_REFRESH_POOL_SIZE: ${LAB_CACHE_L1_REFRESH_POOL_SIZE:-2}
  LAB_CACHE_L1_REFRESH_QUEUE_CAPACITY: ${LAB_CACHE_L1_REFRESH_QUEUE_CAPACITY:-100}
  LAB_CACHE_L1_KEEP_ALIVE_SECONDS: ${LAB_CACHE_L1_KEEP_ALIVE_SECONDS:-60}
  LAB_CACHE_L1_REFRESH_THREAD_PREFIX: ${LAB_CACHE_L1_REFRESH_THREAD_PREFIX:-avalanche-l1-refresh}
  LAB_CACHE_DB_FALLBACK_PERMITS: ${LAB_CACHE_DB_FALLBACK_PERMITS:-50}
  LAB_CACHE_DB_FALLBACK_PERIOD_MS: ${LAB_CACHE_DB_FALLBACK_PERIOD_MS:-1000}
  #   Preheat (M4-3) and the L1 sizing that used to live in TwoLevelCache.
  LAB_CACHE_PREHEAT_ENABLED: ${LAB_CACHE_PREHEAT_ENABLED:-true}
  LAB_CACHE_PREHEAT_TOP_N: ${LAB_CACHE_PREHEAT_TOP_N:-200}
  LAB_CACHE_PREHEAT_HOT_LIST_KEY: ${LAB_CACHE_PREHEAT_HOT_LIST_KEY:-hot:products}
  LAB_CACHE_PREHEAT_TRACKER_CAPACITY: ${LAB_CACHE_PREHEAT_TRACKER_CAPACITY:-100000}
  LAB_CACHE_PREHEAT_TRACKER_DECAY_INTERVAL_SECONDS: ${LAB_CACHE_PREHEAT_TRACKER_DECAY_INTERVAL_SECONDS:-30}
  LAB_CACHE_PREHEAT_TRACKER_FLUSH_INTERVAL_SECONDS: ${LAB_CACHE_PREHEAT_TRACKER_FLUSH_INTERVAL_SECONDS:-10}
  LAB_CACHE_PREHEAT_LOAD_CHUNK_SIZE: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_SIZE:-50}
  LAB_CACHE_PREHEAT_LOAD_CHUNK_PAUSE_MS: ${LAB_CACHE_PREHEAT_LOAD_CHUNK_PAUSE_MS:-50}
  LAB_CACHE_PREHEAT_STARTUP_DELAY_MS: ${LAB_CACHE_PREHEAT_STARTUP_DELAY_MS:-1000}
  LAB_CACHE_PREHEAT_PERIODIC_INTERVAL_SECONDS: ${LAB_CACHE_PREHEAT_PERIODIC_INTERVAL_SECONDS:-300}
  LAB_CACHE_PREHEAT_SCHEDULER_POOL_SIZE: ${LAB_CACHE_PREHEAT_SCHEDULER_POOL_SIZE:-1}
  LAB_CACHE_PREHEAT_THREAD_PREFIX: ${LAB_CACHE_PREHEAT_THREAD_PREFIX:-cache-preheat}
  LAB_CACHE_L1_MAXIMUM_SIZE: ${LAB_CACHE_L1_MAXIMUM_SIZE:-10000}
  LAB_CACHE_L1_REFRESH_AFTER_WRITE_SECONDS: ${LAB_CACHE_L1_REFRESH_AFTER_WRITE_SECONDS:-10}
  LAB_CACHE_L1_EXPIRE_AFTER_WRITE_SECONDS: ${LAB_CACHE_L1_EXPIRE_AFTER_WRITE_SECONDS:-60}
  # B0-03 Caffeine stats export; leave this key's position untouched (owned by B0-03).
  LAB_CACHE_L1_MICROMETER_STATS_ENABLED: ${LAB_CACHE_L1_MICROMETER_STATS_ENABLED:-true}
  #   Experiment dataset (seeding) and the state view's SCAN hint.
  LAB_CACHE_SEED_PRODUCT_COUNT: ${LAB_CACHE_SEED_PRODUCT_COUNT:-1000}
  LAB_CACHE_SEED_START_ID: ${LAB_CACHE_SEED_START_ID:-90000}
  LAB_CACHE_SEED_PROTECTED_MAX_ID: ${LAB_CACHE_SEED_PROTECTED_MAX_ID:-1000}
  LAB_CACHE_SEED_AVALANCHE_KEY_COUNT: ${LAB_CACHE_SEED_AVALANCHE_KEY_COUNT:-200}
  LAB_CACHE_SEED_AVALANCHE_TTL_SECONDS: ${LAB_CACHE_SEED_AVALANCHE_TTL_SECONDS:-60}
  LAB_CACHE_SEED_HOT_KEY_INDEX: ${LAB_CACHE_SEED_HOT_KEY_INDEX:-999}
  LAB_CACHE_SEED_HOT_KEY_TTL_SECONDS: ${LAB_CACHE_SEED_HOT_KEY_TTL_SECONDS:-300}
  LAB_CACHE_SEED_WRITE_BATCH_SIZE: ${LAB_CACHE_SEED_WRITE_BATCH_SIZE:-200}
  LAB_CACHE_SEED_NAME_PREFIX: ${LAB_CACHE_SEED_NAME_PREFIX:-实验商品}
  LAB_CACHE_SEED_STATUS: ${LAB_CACHE_SEED_STATUS:-ON_SALE}
  LAB_CACHE_SEED_PRICE: ${LAB_CACHE_SEED_PRICE:-99.00}
  LAB_CACHE_STATE_SCAN_COUNT: ${LAB_CACHE_STATE_SCAN_COUNT:-500}
  OTEL_SERVICE_NAME: seckill-app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  # Metrics stay on the Actuator scrape path; logs stay on stdout (JSON).
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev

services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: jl-nginx
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Static Vue console built by up.sh; dist is gitignored.
      - ../dashboard/dist:/usr/share/nginx/html/lab:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "nginx"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
      chaos-controller:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: jl-mysql
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - jl-mysql-data:/var/lib/mysql
      - ./mysql/init/00-exporter.sql:/docker-entrypoint-initdb.d/00-exporter.sql:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "mysql"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    container_name: jl-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: ${TZ}
    volumes:
      - jl-redis-data:/data
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "redis"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: jl-rabbitmq
    hostname: jl-rabbitmq
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - jl-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # --- Application tier (Task 10): three identical instances, Nginx entry only ---

  app-1:
    <<: *app-common
    container_name: jl-app-1
    environment:
      <<: *app-env
      INSTANCE_ID: app-1

  app-2:
    <<: *app-common
    container_name: jl-app-2
    environment:
      <<: *app-env
      INSTANCE_ID: app-2

  app-3:
    <<: *app-common
    container_name: jl-app-3
    environment:
      <<: *app-env
      INSTANCE_ID: app-3

  # --- D7 dual-JDK comparison (design section 10): opt-in Java 8 runtime ---
  # Profile-gated on purpose: the default render stays at 16 services and
  # `up.sh --profile dual-jdk` renders 17 (16 + this one). No host port: it is
  # reachable on jl-net as seckill-app-jdk8:8080, which is also the Prometheus
  # target. It reads the same MySQL seed data as the JDK 21 instances
  # (APP_PROFILE=mysql) so throughput/P99 are not flattered by an H2 in-memory
  # database; set JDK8_APP_PROFILE=demo for a zero-dependency startup sample.
  seckill-app-jdk8:
    image: java-learn-lab/seckill-app:jdk8
    build:
      context: ../..
      dockerfile: services/seckill-app-jdk8/Dockerfile
      args:
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION:-2.10.0}
    container_name: jl-seckill-app-jdk8
    restart: unless-stopped
    profiles: ["dual-jdk"]
    mem_limit: ${JDK8_MEM_LIMIT:-768m}
    environment:
      TZ: ${TZ}
      APP_NAME: seckill-app-jdk8
      APP_PROFILE: ${JDK8_APP_PROFILE:-mysql}
      SERVER_PORT: "8080"
      INSTANCE_ID: ${JDK8_INSTANCE_ID:-app-jdk8}
      # Internal lab API (design 9.3). The JDK 8 shell gets the same shared
      # secret as the JDK 21 tier; the snapshot bundle lands in the SAME host
      # root as the JDK 21 instances (instance name app-jdk8 keeps them apart).
      # jstack/jmap come from the jdk-alpine runtime image; jmap stays non-live
      # so the capture does not GC the heap it is about to describe.
      LAB_TOKEN: ${LAB_TOKEN:-lab-token}
      LAB_SNAPSHOT_ENABLED: "true"
      LAB_SNAPSHOT_DIR: /app/lab-snapshots
      LAB_SNAPSHOT_MAX_COUNT: ${LAB_THREAD_SNAPSHOT_MAX_COUNT:-20}
      LAB_SNAPSHOT_MAX_AGE_SECONDS: ${LAB_THREAD_SNAPSHOT_MAX_AGE_SECONDS:-604800}
      LAB_SNAPSHOT_COMMAND_TIMEOUT_MS: ${LAB_SNAPSHOT_COMMAND_TIMEOUT_MS:-5000}
      LAB_SNAPSHOT_JMAP_MODE: ${LAB_SNAPSHOT_JMAP_MODE:-histo}
      # jmap -heap does not exist on 8u; heap-info uses JDK 8's jcmd (present in
      # the jdk-alpine image) and is the same text the JDK 21 bundle carries.
      LAB_SNAPSHOT_JCMD_PATH: jcmd
      # Best-effort Grafana annotation (same POST /api/annotations contract as
      # the JDK 21 tier). The JDK 8 shell reads its own LAB_SNAPSHOT_* namespace,
      # but the URL value mirrors the app tier's LAB_THREAD_SNAPSHOT_GRAFANA_URL
      # and the credentials are the same .env pair (never logged by the app).
      LAB_SNAPSHOT_ANNOTATION_ENABLED: ${LAB_SNAPSHOT_ANNOTATION_ENABLED:-true}
      LAB_SNAPSHOT_GRAFANA_URL: ${LAB_THREAD_SNAPSHOT_GRAFANA_URL:-http://grafana:3000}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      LAB_SNAPSHOT_ANNOTATION_CONNECT_TIMEOUT_MS: ${LAB_SNAPSHOT_ANNOTATION_CONNECT_TIMEOUT_MS:-2000}
      LAB_SNAPSHOT_ANNOTATION_READ_TIMEOUT_MS: ${LAB_SNAPSHOT_ANNOTATION_READ_TIMEOUT_MS:-3000}
      LAB_SNAPSHOT_ANNOTATION_TAGS: ${LAB_SNAPSHOT_ANNOTATION_TAGS:-}
      # The analysis template is the repository file, mounted read-only below;
      # the bundle copy is byte-identical to doc/process/Stage1/snapshot-analysis-template.md.
      LAB_SNAPSHOT_TEMPLATE_PATH: /app/snapshot-analysis-template.md
      # The shared lab database (same rows the JDK 21 shell's Flyway created).
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Same heap cap as the JDK 21 instances (design 10.2).
      JAVA_TOOL_OPTIONS: "${JDK8_JAVA_TOOL_OPTIONS:--Xmx512m}"
      # Same agent/endpoint wiring as the JDK 21 tier: startup is measured with
      # identical instrumentation, spans land in Tempo, metrics stay on the
      # Actuator scrape path.
      OTEL_SERVICE_NAME: seckill-app-jdk8
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
    volumes:
      # Same host snapshots root as the JDK 21 tier (three levels up from
      # code/lab/docker/): both runtimes' bundles sit side by side for D7/D6.
      - ../../../doc/process/Stage1/snapshots:/app/lab-snapshots
      # Reuse the repository analysis template instead of forking a copy into
      # the image; the service copies it into every bundle.
      - ../../../doc/process/Stage1/snapshot-analysis-template.md:/app/snapshot-analysis-template.md:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "app"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  # --- Lab controller (Task 11): token-protected container list + log tail ---

  chaos-controller:
    image: java-learn-lab/chaos-controller:jdk21
    build:
      context: ../..
      dockerfile: services/chaos-controller/Dockerfile
    container_name: jl-chaos-controller
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      LAB_TOKEN: ${LAB_TOKEN:-lab-token}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Grafana annotation credentials (Task 21), interpolated from .env.
      # Annotations are best-effort: a missing/broken Grafana never fails an action.
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Chaos TTL/watchdog defaults; override per run in .env without a rebuild.
      CHAOS_DEFAULT_TTL_SECONDS: ${CHAOS_DEFAULT_TTL_SECONDS:-120}
      CHAOS_MAX_TTL_SECONDS: ${CHAOS_MAX_TTL_SECONDS:-600}
      CHAOS_ACTION_TIMEOUT_SECONDS: ${CHAOS_ACTION_TIMEOUT_SECONDS:-30}
      CHAOS_WATCHDOG_INTERVAL_SECONDS: ${CHAOS_WATCHDOG_INTERVAL_SECONDS:-5}
      CHAOS_STOP_GRACE_SECONDS: ${CHAOS_STOP_GRACE_SECONDS:-10}
      CHAOS_MAX_REVERT_ATTEMPTS: ${CHAOS_MAX_REVERT_ATTEMPTS:-3}
      CHAOS_SCHEDULER_THREADS: ${CHAOS_SCHEDULER_THREADS:-4}
      CHAOS_ANNOTATION_ENABLED: ${CHAOS_ANNOTATION_ENABLED:-true}
      CHAOS_ANNOTATION_GRAFANA_URL: ${CHAOS_ANNOTATION_GRAFANA_URL:-http://grafana:3000}
      CHAOS_ANNOTATION_TIMEOUT_SECONDS: ${CHAOS_ANNOTATION_TIMEOUT_SECONDS:-3}
      CHAOS_ANNOTATION_TAGS: ${CHAOS_ANNOTATION_TAGS:-}
      # Task 22b: interactive guide reads the same scenario JSON as k6.
      # M3-1c widens the default just enough for the Sentinel drill: app
      # instances plus jl-redis-<n>. Sentinel containers stay out on purpose
      # (they are not datastore-shaped, so the allow-list below would not
      # govern them); the datastore rule further restricts redis to 1-3.
      CHAOS_GUIDE_SCENARIO_DIR: ${CHAOS_GUIDE_SCENARIO_DIR:-/app/scenarios}
      CHAOS_GUIDE_TARGET_PATTERN: ${CHAOS_GUIDE_TARGET_PATTERN:-^jl-(app|redis)-[0-9]$$}
      # M3-1c closed-by-default datastore allow-list, opened in the lab compose
      # ONLY as far as the HA drills need: exactly jl-redis-1/2/3 and
      # jl-mysql-1/2/3 (the step-31 Router drill kills the MySQL primary),
      # whole-name matching. The code default (empty) stays refuse-all, so any
      # deployment outside this file keeps the old safety level. `jl-redis` and
      # `jl-mysql` (dev single nodes), `jl-rabbitmq`, the *-exporter sidecars,
      # jl-redis-10 and jl-mysql-10 all fail this pattern: the keyword test
      # still runs first, so none of them can slip through via a loose
      # substring. The `$$` is Compose's literal dollar (the container sees
      # `...$`), not part of the regex.
      CHAOS_DATASTORE_ALLOWED_TARGET_PATTERN: ${CHAOS_DATASTORE_ALLOWED_TARGET_PATTERN:-^jl-(redis|mysql)-[1-3]$$}
      # Task 23: manual (lab default) leaves injected faults in place when the
      # guide finishes so the operator can inspect them; auto reverts at once.
      LAB_RESET_MODE: ${LAB_RESET_MODE:-manual}
      CHAOS_TRAFFIC_CONTAINER: ${CHAOS_TRAFFIC_CONTAINER:-jl-traffic}
      CHAOS_TRAFFIC_STOP_GRACE_SECONDS: ${CHAOS_TRAFFIC_STOP_GRACE_SECONDS:-5}
      # MySQL InnoDB Cluster probe (design §8.3 / D11). Each key maps 1:1 to
      # chaos.mysql-cluster.* in application.yml; the SQL and argv stay in the
      # YAML image config. The code default target is jl-mysql-1, but the LAB
      # default here is jl-mysql-3: jl-mysql-1 is the usual failover-drill kill
      # target, and a probe running on the killed node freezes every
      # mysql_cluster_* series instead of reporting the failover (step-47).
      # The probe also WARNs if its target later becomes PRIMARY.
      CHAOS_MYSQL_CLUSTER_ENABLED: ${CHAOS_MYSQL_CLUSTER_ENABLED:-true}
      CHAOS_MYSQL_CLUSTER_INTERVAL_SECONDS: ${CHAOS_MYSQL_CLUSTER_INTERVAL_SECONDS:-10}
      CHAOS_MYSQL_CLUSTER_CONTAINER: ${CHAOS_MYSQL_CLUSTER_CONTAINER:-jl-mysql-3}
      CHAOS_MYSQL_CLUSTER_ADMIN_USER: ${CHAOS_MYSQL_CLUSTER_ADMIN_USER:-root}
      CHAOS_MYSQL_CLUSTER_PASSWORD_ENV_VAR: ${CHAOS_MYSQL_CLUSTER_PASSWORD_ENV_VAR:-MYSQL_ROOT_PASSWORD}
      CHAOS_MYSQL_CLUSTER_EXEC_TIMEOUT_SECONDS: ${CHAOS_MYSQL_CLUSTER_EXEC_TIMEOUT_SECONDS:-6}
      CHAOS_MYSQL_CLUSTER_EXPECTED_MEMBER_COUNT: ${CHAOS_MYSQL_CLUSTER_EXPECTED_MEMBER_COUNT:-3}
      CHAOS_MYSQL_CLUSTER_THREAD_NAME: ${CHAOS_MYSQL_CLUSTER_THREAD_NAME:-mysql-cluster-probe}
      CHAOS_MYSQL_CLUSTER_SHUTDOWN_TIMEOUT_SECONDS: ${CHAOS_MYSQL_CLUSTER_SHUTDOWN_TIMEOUT_SECONDS:-5}
      # Stage2 B1-01 ledger: runs/operations/snapshots/faults/audit go to the
      # dedicated `lab_ledger` database in the same MySQL instance (standalone
      # `mysql:3306`; db-ha through `mysql-router:6446`). Defaults are identical
      # to application.yml and .env.example. The controller deliberately has no
      # depends_on: mysql, so it starts (ledger DEGRADED) during a primary kill.
      LAB_LEDGER_ENABLED: ${LAB_LEDGER_ENABLED:-true}
      LAB_LEDGER_MYSQL_MODE: ${LAB_LEDGER_MYSQL_MODE:-${MYSQL_MODE:-standalone}}
      LAB_LEDGER_STANDALONE_URL: "${LAB_LEDGER_STANDALONE_URL:-jdbc:mysql://${MYSQL_HOST:-mysql}:3306/lab_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      LAB_LEDGER_ROUTER_URL: "${LAB_LEDGER_ROUTER_URL:-jdbc:mysql://${MYSQL_ROUTER_HOST:-mysql-router}:6446/lab_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      LAB_LEDGER_SCHEMA: ${LAB_LEDGER_SCHEMA:-lab_ledger}
      # root: the business `seckill` account cannot CREATE DATABASE lab_ledger,
      # and the controller already holds the Docker socket (root-equivalent).
      # The password defaults to MYSQL_ROOT_PASSWORD; it is never in the URL.
      LAB_LEDGER_USER: ${LAB_LEDGER_USER:-root}
      LAB_LEDGER_PASSWORD: ${LAB_LEDGER_PASSWORD:-${MYSQL_ROOT_PASSWORD:-labroot}}
      LAB_SOURCE_COMMIT: ${LAB_SOURCE_COMMIT:-unknown}
      LAB_LEDGER_OPERATOR: ${LAB_LEDGER_OPERATOR:-local}
      LAB_LEDGER_MAX_POOL_SIZE: ${LAB_LEDGER_MAX_POOL_SIZE:-4}
      LAB_LEDGER_MIN_IDLE: ${LAB_LEDGER_MIN_IDLE:-1}
      LAB_LEDGER_CONNECTION_TIMEOUT_MS: ${LAB_LEDGER_CONNECTION_TIMEOUT_MS:-3000}
      LAB_LEDGER_VALIDATION_TIMEOUT_MS: ${LAB_LEDGER_VALIDATION_TIMEOUT_MS:-1000}
      LAB_LEDGER_BOOTSTRAP_RETRY_SECONDS: ${LAB_LEDGER_BOOTSTRAP_RETRY_SECONDS:-15}
      LAB_LEDGER_BOOTSTRAP_THREAD_NAME: ${LAB_LEDGER_BOOTSTRAP_THREAD_NAME:-ledger-bootstrap}
      LAB_LEDGER_FLYWAY_LOCATIONS: ${LAB_LEDGER_FLYWAY_LOCATIONS:-classpath:db/ledger}
      LAB_LEDGER_STASH_DIR: ${LAB_LEDGER_STASH_DIR:-/app/ledger-stash}
      LAB_LEDGER_STASH_MAX_FILES: ${LAB_LEDGER_STASH_MAX_FILES:-500}
      LAB_LEDGER_STASH_MAX_BYTES: ${LAB_LEDGER_STASH_MAX_BYTES:-262144}
      LAB_LEDGER_STASH_REPLAY_INTERVAL_SECONDS: ${LAB_LEDGER_STASH_REPLAY_INTERVAL_SECONDS:-20}
      LAB_LEDGER_RETENTION_RUNS: ${LAB_LEDGER_RETENTION_RUNS:-50}
      LAB_LEDGER_RETENTION_INTERVAL_MINUTES: ${LAB_LEDGER_RETENTION_INTERVAL_MINUTES:-30}
      LAB_LEDGER_RECOVERY_ENABLED: ${LAB_LEDGER_RECOVERY_ENABLED:-true}
      LAB_LEDGER_QUERY_DEFAULT_LIMIT: ${LAB_LEDGER_QUERY_DEFAULT_LIMIT:-50}
      LAB_LEDGER_QUERY_MAX_LIMIT: ${LAB_LEDGER_QUERY_MAX_LIMIT:-200}
      LAB_LEDGER_MAX_PAYLOAD_BYTES: ${LAB_LEDGER_MAX_PAYLOAD_BYTES:-65536}
      LAB_LEDGER_RUN_ID_MAX_ATTEMPTS: ${LAB_LEDGER_RUN_ID_MAX_ATTEMPTS:-10}
    volumes:
      # Read-write socket is required for later fault actions. Lab-only: the
      # token filter and the lab=java-learn whitelist are enforced in Java.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared schema-v1 scenarios (read-only). Paths inside them are validated
      # before any Docker call.
      - ../scenarios:/app/scenarios:ro
      # Write-behind ledger stash (B1-01): events that could not be written
      # while MySQL was down survive a controller restart and replay in order.
      - jl-ledger-stash-data:/app/ledger-stash
    expose:
      - "8081"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "chaos"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Interactive background traffic (Task 23). Profile-gated so the default stack
  # never pays for it: up.sh only creates the container and the lab console
  # starts/stops it through chaos-controller (/lab/traffic/**). Reads only, so it
  # never consumes seckill stock; formal load runs still go through bench.sh.
  traffic:
    image: ${K6_IMAGE:-grafana/k6:1.3.0}
    container_name: jl-traffic
    restart: "no"
    profiles: ["traffic"]
    mem_limit: 256m
    # The k6 image's entrypoint is `k6`, so the command carries only its args.
    command: ["run", "--quiet", "/k6/scenarios/traffic.js"]
    environment:
      TZ: ${TZ}
      BASE_URL: ${TRAFFIC_BASE_URL:-http://nginx}
      PRODUCT_ID: ${TRAFFIC_PRODUCT_ID:-1}
      USER_PREFIX: ${TRAFFIC_USER_PREFIX:-traffic}
      TRAFFIC_VUS: ${TRAFFIC_VUS:-50}
      TRAFFIC_DURATION: ${TRAFFIC_DURATION:-30m}
      THINK_TIME: ${TRAFFIC_THINK_TIME:-1s}
      RUN_ID: ${TRAFFIC_RUN_ID:-console}
    volumes:
      - ../k6:/k6:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "traffic"

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE}
    container_name: jl-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE}
    container_name: jl-mysqld-exporter
    restart: unless-stopped
    mem_limit: 64m
    # v0.15+ removed DATA_SOURCE_NAME; use the supported flags and password env.
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      TZ: ${TZ}
      # Lab-only exporter account (see .env.example). The database-side password is
      # fixed in mysql/init/00-exporter.sql, so changing MYSQLD_EXPORTER_PASSWORD
      # also requires updating that SQL file (and recreating the MySQL volume).
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD}
    expose:
      - "9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  nginx-exporter:
    image: ${NGINX_EXPORTER_IMAGE}
    container_name: jl-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    command: ["-nginx.scrape-uri=http://nginx:80/stub_status"]
    environment:
      TZ: ${TZ}
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  # --- Observability stack (internal only; Grafana is the sole host port) ---

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: jl-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      # The console reaches the UI through Nginx at /prom/. Keep internal
      # routes at / (so scrapes and Grafana keep using http://prometheus:9090)
      # while generated UI links carry the /prom/ prefix.
      - --web.external-url=http://127.0.0.1:8080/prom/
      - --web.route-prefix=/
    environment:
      TZ: ${TZ}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jl-prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: jl-grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # Only Grafana is published on the host, bound to loopback.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - jl-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "grafana"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  tempo:
    image: ${TEMPO_IMAGE}
    container_name: jl-tempo
    restart: unless-stopped
    mem_limit: 384m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      TZ: ${TZ}
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - jl-tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "9095"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "tempo"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready | grep -q ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: jl-otel-collector
    restart: unless-stopped
    mem_limit: 128m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      TZ: ${TZ}
    volumes:
      - ./otel-collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"
    depends_on:
      tempo:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "otel-collector"
    # The official collector image is distroless (no shell/wget), so it cannot
    # run an in-container healthcheck. verify.sh probes / on 13133 over jl-net.

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: jl-cadvisor
    restart: unless-stopped
    mem_limit: 128m
    # Lab-only: required by cAdvisor to read cgroups/host mounts.
    privileged: true
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=lab,lab.role
    environment:
      TZ: ${TZ}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "cadvisor"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  jl-mysql-data:
    name: jl-mysql-data
  jl-redis-data:
    name: jl-redis-data
  jl-rabbitmq-data:
    name: jl-rabbitmq-data
  jl-prometheus-data:
    name: jl-prometheus-data
  jl-grafana-data:
    name: jl-grafana-data
  jl-tempo-data:
    name: jl-tempo-data
  jl-ledger-stash-data:
    name: jl-ledger-stash-data

networks:
  jl-net:
    name: jl-net
    driver: bridge
