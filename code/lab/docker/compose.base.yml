# Shared infrastructure for the Java HA lab.
# Dev-only host exposure lives in compose.dev.yml. Add HA overlays in later milestones.

name: java-learn-lab

services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: jl-nginx
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "nginx"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: jl-mysql
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - jl-mysql-data:/var/lib/mysql
      - ./mysql/init/00-exporter.sql:/docker-entrypoint-initdb.d/00-exporter.sql:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "mysql"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    container_name: jl-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: ${TZ}
    volumes:
      - jl-redis-data:/data
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "redis"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: jl-rabbitmq
    hostname: jl-rabbitmq
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - jl-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE}
    container_name: jl-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      TZ: ${TZ}
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE}
    container_name: jl-mysqld-exporter
    restart: unless-stopped
    mem_limit: 64m
    # v0.15+ removed DATA_SOURCE_NAME; use the supported flags and password env.
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      TZ: ${TZ}
      # Fixed lab-only account and password, created by mysql/init/00-exporter.sql.
      MYSQLD_EXPORTER_PASSWORD: exporter
    expose:
      - "9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

  nginx-exporter:
    image: ${NGINX_EXPORTER_IMAGE}
    container_name: jl-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    command: ["-nginx.scrape-uri=http://nginx:80/stub_status"]
    environment:
      TZ: ${TZ}
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - jl-net
    labels:
      lab: "java-learn"
      lab.role: "exporter"

volumes:
  jl-mysql-data:
    name: jl-mysql-data
  jl-redis-data:
    name: jl-redis-data
  jl-rabbitmq-data:
    name: jl-rabbitmq-data

networks:
  jl-net:
    name: jl-net
    driver: bridge
