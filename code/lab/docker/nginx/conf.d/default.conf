server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Host-side daemons poll /api/daemon/* (heartbeat, ws, tasks); no app
    # endpoint uses this prefix. Answer locally so those probes never reach the
    # upstream, polluting app metrics/traces or the round-robin pointer.
    location ^~ /api/daemon/ {
        access_log off;
        return 404;
    }

    # Round-robin across the three app instances. Nginx re-resolves the compose
    # service names at startup; depends_on waits until all three are healthy.
    location /api/ {
        proxy_pass http://seckill_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Lab console and controller (Task 11) ---

    location = /lab {
        return 301 /lab/;
    }

    # The app runtime lab API is internal only (Task 17). Nginx must never
    # proxy these paths: in-network callers use the app port directly (or the
    # chaos-controller later). The static console below keeps /lab/ itself.
    location ~ ^/lab/(toggles|config)(/|$) {
        return 404;
    }

    # Static Vue console built into code/lab/dashboard/dist and mounted here.
    location /lab/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /lab/index.html;
    }

    # Token-protected lab API. X-Lab-Token is validated by the controller.
    location /lab-api/ {
        proxy_pass http://chaos-controller:8081/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        # B4-02 controlled rebuild waits for a cold Spring Boot start
        # (observed 20-100s) plus health/pool/nginx/Prometheus gates.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus stays internal; /prom/ is a lab convenience proxy for queries.
    location /prom/ {
        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Scraped by nginx-prometheus-exporter on the compose network only.
    location = /stub_status {
        access_log off;
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

upstream seckill_backend {
    # Shared state across Nginx workers: without a zone the round-robin pointer is
    # per worker, so the first request on each fresh worker hits app-1.
    zone seckill_backend 64k;
    server app-1:8080 max_fails=2 fail_timeout=5s;
    server app-2:8080 max_fails=2 fail_timeout=5s;
    server app-3:8080 max_fails=2 fail_timeout=5s;
}
