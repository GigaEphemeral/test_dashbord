server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Scraped by nginx-prometheus-exporter on the compose network only.
    location = /stub_status {
        access_log off;
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
