server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Round-robin across the three app instances. Nginx re-resolves the compose
    # service names at startup; depends_on waits until all three are healthy.
    location /api/ {
        proxy_pass http://seckill_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scraped by nginx-prometheus-exporter on the compose network only.
    location = /stub_status {
        access_log off;
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

upstream seckill_backend {
    # Shared state across Nginx workers: without a zone the round-robin pointer is
    # per worker, so the first request on each fresh worker hits app-1.
    zone seckill_backend 64k;
    server app-1:8080 max_fails=2 fail_timeout=5s;
    server app-2:8080 max_fails=2 fail_timeout=5s;
    server app-3:8080 max_fails=2 fail_timeout=5s;
}
